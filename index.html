<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شات خاص - تحديث شامل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <!-- Firebase مكتبات -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    /* ===== تحديث شامل للتصميم ===== */
    :root {
      --primary: #00ff41;
      --primary-glow: rgba(0, 255, 65, 0.3);
      --bg-dark: #0a0a0a;
      --bg-input: #0d1117;
      --text-secondary: #00cc33;
      --border-dim: #003300;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Share Tech Mono', 'Tajawal', monospace;
      color: var(--primary);
      position: fixed;
      top: 0;
      left: 0;
      touch-action: manipulation;
    }

    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* للهواتف */
      background: var(--bg-dark);
    }

    /* ===== منطقة الرسائل ===== */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
      background: var(--bg-dark);
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .msg {
      margin: 6px 0;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      direction: ltr;
      text-align: left;
      font-size: 14px;
      line-height: 1.6;
      background: rgba(0, 255, 65, 0.03);
      border-right: 2px solid transparent;
      transition: all 0.2s ease;
      border-radius: 4px;
    }

    .msg:hover {
      background: rgba(0, 255, 65, 0.06);
      border-right-color: var(--primary);
    }

    .msg .user {
      color: var(--primary);
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .msg .user:hover {
      color: #ffffff;
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .msg .time {
      font-size: 11px;
      color: #005a00;
      margin-right: auto;
      flex-shrink: 0;
    }

    .msg .text {
      color: var(--text-secondary);
      word-break: break-word;
    }

    .sys {
      text-align: center;
      color: #008800;
      font-size: 12px;
      margin: 8px auto;
      font-style: italic;
      background: rgba(0, 255, 65, 0.05);
      padding: 6px 12px;
      border: 1px solid var(--border-dim);
      border-radius: 16px;
      transition: opacity 0.5s ease;
      width: fit-content;
      max-width: 90%;
    }

    .sys.fade-out {
      opacity: 0;
    }

    /* ===== مؤشر الكتابة - محسّن ===== */
    #typingIndicator {
      flex-shrink: 0;
      min-height: 28px;
      line-height: 28px;
      padding: 0 16px;
      font-size: 12px;
      font-style: italic;
      color: var(--text-secondary);
      background: rgba(0, 255, 65, 0.04);
      border-top: 1px solid var(--border-dim);
      border-bottom: 1px solid var(--border-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    #typingIndicator.visible {
      opacity: 1;
      animation: typingPulse 1.5s infinite;
    }

    @keyframes typingPulse {
      0%, 100% { background: rgba(0, 255, 65, 0.04); }
      50% { background: rgba(0, 255, 65, 0.08); }
    }

    /* ===== منطقة الإدخال - إعادة تصميم كاملة ===== */
    #inputArea {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--bg-input);
      border-top: 2px solid var(--primary);
      flex-shrink: 0;
      min-height: 60px;
      position: relative;
      z-index: 10;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    }

    #messageInput {
      flex: 1;
      font-size: 16px !important;
      padding: 12px 16px;
      border: 2px solid var(--primary);
      border-radius: 24px;
      font-family: 'Share Tech Mono', 'Tajawal', monospace;
      background: var(--bg-dark);
      color: var(--primary);
      height: 48px;
      line-height: 1.5;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 0 rgba(0, 255, 65, 0);
    }

    #messageInput:focus {
      border-color: #ffffff;
      background: #050505;
      box-shadow: 0 0 20px var(--primary-glow);
      transform: translateY(-2px);
    }

    #messageInput::placeholder {
      color: #005a00;
      opacity: 0.7;
    }

    #sendBtn {
      padding: 12px 20px;
      border: 2px solid var(--primary);
      border-radius: 24px;
      background: var(--bg-dark);
      color: var(--primary);
      cursor: pointer;
      font-family: 'Share Tech Mono', 'Tajawal', monospace;
      font-size: 14px;
      font-weight: bold;
      height: 48px;
      transition: all 0.3s ease;
      flex-shrink: 0;
      touch-action: manipulation;
      white-space: nowrap;
      box-shadow: 0 0 0 rgba(0, 255, 65, 0);
    }

    #sendBtn:hover {
      background: var(--primary);
      color: var(--bg-dark);
      box-shadow: 0 0 30px var(--primary-glow);
      transform: translateY(-2px);
    }

    #sendBtn:active {
      background: #004400;
      color: var(--primary);
      transform: translateY(0);
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* ===== قائمة المتصلين ===== */
    #onlineList {
      position: fixed;
      top: 10px;
      right: 10px;
      border: 2px solid var(--primary);
      background: var(--bg-dark);
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      transition: all 0.3s;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
    }

    #onlineList:hover {
      background: var(--primary);
      color: var(--bg-dark);
      box-shadow: 0 0 25px var(--primary-glow);
    }

    #onlineList .fa {
      color: var(--primary);
      font-size: 14px;
    }

    #onlineList:hover .fa {
      color: var(--bg-dark);
    }

    #usersBox {
      position: fixed;
      top: 45px;
      right: 10px;
      background: var(--bg-dark);
      border: 2px solid var(--primary);
      padding: 12px 16px;
      z-index: 999;
      min-width: 180px;
      max-width: 240px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      color: var(--primary);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }

    #usersBox.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #usersBox h4 {
      margin: 0 0 8px 0;
      color: var(--primary);
      font-size: 14px;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 8px;
    }

    #usersList {
      max-height: 250px;
      overflow-y: auto;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 4px;
      border-bottom: 1px solid rgba(0, 51, 0, 0.5);
      font-size: 12px;
      cursor: default;
      transition: all 0.2s;
    }

    .user-item:hover {
      background: rgba(0, 255, 65, 0.05);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid var(--primary);
      flex-shrink: 0;
    }

    .status-green {
      background-color: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .status-yellow {
      background-color: #ffaa00;
      box-shadow: 0 0 10px #ffaa00;
    }

    /* ===== حالة الاتصال ===== */
    #connection-status {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      font-size: 12px;
      font-weight: bold;
      z-index: 999;
      display: none;
      border: 2px solid var(--primary);
      background: var(--bg-dark);
      font-family: 'Share Tech Mono', monospace;
      border-radius: 20px;
    }

    #connection-status.visible {
      display: block;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 20px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    #connection-status.online {
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 30px var(--primary-glow);
    }

    #connection-status.offline {
      color: #ff0044;
      border-color: #ff0044;
      box-shadow: 0 0 30px rgba(255, 0, 68, 0.3);
    }

    #connection-status.reconnecting {
      color: #ffaa00;
      border-color: #ffaa00;
      box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
    }

    /* ===== سكرول بار ===== */
    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--primary);
      border: 2px solid var(--border-dim);
      border-radius: 8px;
    }

    #messages::-webkit-scrollbar-thumb:hover {
      background: #ffffff;
    }

    /* ===== للهواتف المحمولة ===== */
    @media (max-width: 768px) {
      #messageInput {
        font-size: 16px !important;
        height: 44px;
        padding: 10px 14px;
        border-radius: 20px;
      }

      #sendBtn {
        height: 44px;
        padding: 10px 16px;
        font-size: 13px;
        border-radius: 20px;
      }

      #inputArea {
        padding: 10px 12px;
        min-height: 56px;
        gap: 8px;
      }

      .msg {
        font-size: 13px;
        padding: 6px 10px;
      }

      #onlineList {
        top: 6px;
        right: 6px;
        padding: 6px 12px;
        font-size: 11px;
      }

      #typingIndicator {
        min-height: 24px;
        line-height: 24px;
        font-size: 11px;
        padding: 0 12px;
      }
    }

    /* للشاشات الصغيرة جداً */
    @media (max-width: 480px) {
      #sendBtn {
        padding: 8px 12px;
        font-size: 12px;
      }
      
      #messageInput {
        font-size: 14px !important;
      }
    }
  </style>
</head>
<body>
  <!-- واجهة الدردشة -->
  <div id="chat-container">
    <div id="onlineList" title="المتصلون الآن">
      <i class="fa fa-users"></i>
      <span id="count">0</span>
      <span>متصل</span>
    </div>
    <div id="usersBox"><h4>🖥️ المتصلين</h4><div id="usersList"></div></div>
    <div id="messages"></div>
    <div id="connection-status"></div>
    <div id="typingIndicator">💬 شخص يكتب...</div>
    <form id="inputArea" action="javascript:void(0);">
      <input type="text" id="messageInput" placeholder="✍️ اكتب رسالتك..." autocomplete="off" aria-label="حقل إدخال الرسالة" />
      <button type="submit" id="sendBtn">
        <i class="fa fa-send"></i> إرسال
      </button>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const firebaseConfig = {
        apiKey: "AIzaSyB1AsEHXP05nQ8M66jYPusheLaE60q_JwU",
        authDomain: "mychat-2d881.firebaseapp.com",
        databaseURL: "https://mychat-2d881-default-rtdb.firebaseio.com",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // ===== ID فريد للمستخدم =====
      let userId = localStorage.getItem('chat_userId');
      if (!userId) {
        userId = 'uid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_userId', userId);
      }

      // ===== الاسم مع حفظ =====
      let username = localStorage.getItem('chat_username');
      if (!username) {
        username = "زائر" + Math.floor(Math.random() * 9999);
        localStorage.setItem('chat_username', username);
      }

      // ===== عناصر الواجهة =====
      const onlineList = document.getElementById("onlineList");
      const usersBox = document.getElementById("usersBox");
      const usersList = document.getElementById("usersList");
      const onlineCountEl = document.getElementById("count");
      const messagesDiv = document.getElementById("messages");
      const connectionStatus = document.getElementById("connection-status");
      const typingIndicatorEl = document.getElementById("typingIndicator");

      // ===== مراجع Firebase =====
      const userRef = db.ref("online/" + userId);
      const messagesRef = db.ref("messages");
      const onlineRef = db.ref("online");
      const typingRef = db.ref("typing");
      const myTypingRef = db.ref("typing/" + userId);

      const messageInput = document.getElementById("messageInput");
      const inputAreaForm = document.getElementById("inputArea");

      let typingTimer;
      let isTypingLocally = false;
      let serverTimeOffset = 0;
      let isConnected = false;

      // ===== تنسيق الوقت النسبي =====
      const TIME_FORMS = {
        seconds: { one: 'ثانية', two: 'ثانيتين', few: 'ثوانٍ', many: 'ثانية' },
        minutes: { one: 'دقيقة', two: 'دقيقتين', few: 'دقائق', many: 'دقيقة' },
        hours:   { one: 'ساعة',  two: 'ساعتين',  few: 'ساعات', many: 'ساعة' },
        days:    { one: 'يوم',   two: 'يومين',   few: 'أيام',  many: 'يوم' }
      };

      function formatUnit(n, forms) {
        if (n === 1) return `قبل ${forms.one}`;
        if (n === 2) return `قبل ${forms.two}`;
        if (n >= 3 && n <= 10) return `قبل ${n} ${forms.few}`;
        return `قبل ${n} ${forms.many}`;
      }

      function formatRelativeTime(timestampMs) {
        if (!timestampMs) return '';
        const now = Date.now() + serverTimeOffset;
        let diffSeconds = Math.floor((now - timestampMs) / 1000);
        if (diffSeconds < 0) diffSeconds = 0;

        if (diffSeconds < 5) return 'الآن';
        if (diffSeconds < 60) return formatUnit(diffSeconds, TIME_FORMS.seconds);

        const minutes = Math.floor(diffSeconds / 60);
        if (minutes < 60) return formatUnit(minutes, TIME_FORMS.minutes);

        const hours = Math.floor(minutes / 60);
        if (hours < 24) return formatUnit(hours, TIME_FORMS.hours);

        const days = Math.floor(hours / 24);
        return formatUnit(days, TIME_FORMS.days);
      }

      // ===== ذاكرة محلية للواجهة =====
      const onlineUsersCache = {};
      const typingUsersCache = {};
      let knownUserIds = new Set();
      let pendingMessages = [];

      // ===== تحميل الرسائل المحفوظة =====
      function loadPendingMessages() {
        const saved = localStorage.getItem('pendingMessages');
        if (saved) {
          try {
            pendingMessages = JSON.parse(saved);
            if (pendingMessages.length > 0) {
              showSystemMsg(`📦 يوجد ${pendingMessages.length} رسالة محفوظة`, true);
            }
          } catch (e) {
            pendingMessages = [];
          }
        }
      }
      loadPendingMessages();

      // ===== عرض حالة الاتصال =====
      function showConnectionStatus(status, type) {
        connectionStatus.textContent = status;
        connectionStatus.className = 'visible ' + type;

        if (type === 'online') {
          setTimeout(() => {
            connectionStatus.className = '';
          }, 2500);
        }
      }

      // ===== مراقبة الاتصال =====
      const connectedRef = firebase.database().ref(".info/connected");
      connectedRef.on("value", (snap) => {
        const connected = snap.val();

        if (connected) {
          isConnected = true;
          showConnectionStatus('✅ متصل بالخادم', 'online');

          userRef.set({
            lastActive: firebase.database.ServerValue.TIMESTAMP,
            name: username,
            userId: userId,
            joinedAt: firebase.database.ServerValue.TIMESTAMP
          });
          userRef.onDisconnect().remove();
          myTypingRef.onDisconnect().remove();

          resendPendingMessages();
        } else {
          isConnected = false;
          showConnectionStatus('⚠️ انقطع الاتصال، جاري إعادة الاتصال...', 'offline');
        }
      });

      // ===== وقت السيرفر =====
      db.ref('.info/serverTimeOffset').on('value', snap => {
        serverTimeOffset = snap.val() || 0;
      });

      // ===== نبضة حضور دورية =====
      setInterval(() => {
        if (isConnected) {
          userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP });
        }
      }, 30000);

      // ===== قائمة المتصلين =====
      onlineList.onclick = e => {
        e.stopPropagation();
        usersBox.classList.toggle('visible');
      };

      document.onclick = () => {
        if (usersBox.classList.contains('visible')) {
          usersBox.classList.remove('visible');
        }
      };

      usersBox.onclick = e => e.stopPropagation();

      function updateOnlineCount() {
        onlineCountEl.textContent = Object.keys(onlineUsersCache).length;
      }

      function buildUserItem(userKey) {
        const userItem = document.createElement("div");
        userItem.className = "user-item";
        userItem.id = "user-" + userKey;

        const statusIndicator = document.createElement("span");
        statusIndicator.className = "status-indicator";
        userItem.appendChild(statusIndicator);

        const userName = document.createElement("span");
        userName.className = "user-name";
        userName.style.cursor = 'default';
        userItem.appendChild(userName);

        return userItem;
      }

      function applyUserItemData(userItem, userKey, userData) {
        const isMe = userKey === userId;
        const displayName = userData.name || userKey;
        const now = Date.now() + serverTimeOffset;
        const twoMinutesAgo = now - (2 * 60 * 1000);

        const statusIndicator = userItem.querySelector('.status-indicator');
        statusIndicator.classList.remove('status-green', 'status-yellow');
        statusIndicator.classList.add((userData.lastActive || 0) < twoMinutesAgo ? 'status-yellow' : 'status-green');

        const userName = userItem.querySelector('.user-name');
        userName.textContent = displayName;
        userName.title = isMe ? 'أنت' : `آخر نشاط: ${formatRelativeTime(userData.lastActive) || 'الآن'}`;

        if (isMe) {
          const badge = document.createElement('span');
          badge.textContent = ' [أنت]';
          badge.style.fontSize = '10px';
          badge.style.color = '#004400';
          userName.appendChild(badge);
        }
      }

      function handleUserAdded(snap) {
        const key = snap.key;
        const data = snap.val();
        onlineUsersCache[key] = data;

        const item = buildUserItem(key);
        applyUserItemData(item, key, data);
        usersList.appendChild(item);
        updateOnlineCount();

        if (key !== userId && !knownUserIds.has(key)) {
          showSystemMsg(`🟢 ${data.name || key} دخل`, true);
        }
        knownUserIds.add(key);
      }

      function handleUserChanged(snap) {
        const key = snap.key;
        const data = snap.val();
        onlineUsersCache[key] = data;

        const item = document.getElementById('user-' + key);
        if (item) applyUserItemData(item, key, data);
      }

      function handleUserRemoved(snap) {
        const key = snap.key;
        const data = onlineUsersCache[key] || snap.val() || {};
        delete onlineUsersCache[key];
        knownUserIds.delete(key);

        const item = document.getElementById('user-' + key);
        if (item) item.remove();
        updateOnlineCount();

        showSystemMsg(`🔴 ${data.name || key} غادر`, true);
      }

      onlineRef.once('value', snap => {
        const data = snap.val() || {};
        Object.keys(data).forEach(k => knownUserIds.add(k));

        onlineRef.on('child_added', handleUserAdded);
        onlineRef.on('child_changed', handleUserChanged);
        onlineRef.on('child_removed', handleUserRemoved);
      });

      // ===== مؤشر الكتابة - محسّن =====
      function renderTypingIndicator() {
        const names = Object.values(typingUsersCache)
          .map(u => u.name)
          .filter(Boolean);

        if (names.length === 0) {
          typingIndicatorEl.classList.remove('visible');
          typingIndicatorEl.textContent = '';
        } else if (names.length === 1) {
          typingIndicatorEl.textContent = `💬 ${names[0]} يكتب الآن...`;
          typingIndicatorEl.classList.add('visible');
        } else if (names.length === 2) {
          typingIndicatorEl.textContent = `💬 ${names[0]} و ${names[1]} يكتبان الآن...`;
          typingIndicatorEl.classList.add('visible');
        } else {
          typingIndicatorEl.textContent = `💬 عدة أشخاص يكتبون الآن...`;
          typingIndicatorEl.classList.add('visible');
        }
      }

      typingRef.on('child_added', snap => {
        if (snap.key === userId) return;
        typingUsersCache[snap.key] = snap.val();
        renderTypingIndicator();
      });

      typingRef.on('child_changed', snap => {
        if (snap.key === userId) return;
        typingUsersCache[snap.key] = snap.val();
        renderTypingIndicator();
      });

      typingRef.on('child_removed', snap => {
        if (snap.key === userId) return;
        delete typingUsersCache[snap.key];
        renderTypingIndicator();
      });

      // ===== تغيير الاسم =====
      function changeUsername(newName) {
        newName = newName.trim();
        if (!newName) {
          showSystemMsg('⚠️ الاسم لا يمكن أن يكون فارغاً', true);
          return;
        }

        if (newName.length > 20) {
          showSystemMsg('⚠️ الاسم طويل جداً (حد أقصى 20 حرف)', true);
          return;
        }

        onlineRef.once('value', snapshot => {
          const users = snapshot.val() || {};
          const nameTaken = Object.keys(users).some(
            key => key !== userId && users[key].name === newName
          );

          if (nameTaken) {
            showSystemMsg('⚠️ هذا الاسم مستخدم بالفعل', true);
            return;
          }

          const oldName = username;
          username = newName;
          localStorage.setItem('chat_username', username);

          if (isConnected) {
            userRef.update({
              name: username,
              lastActive: firebase.database.ServerValue.TIMESTAMP
            });
          }

          showSystemMsg(`✅ ${oldName} → ${username}`, true);
          updateAllMessagesUsername(oldName, username);
        });
      }

      function updateAllMessagesUsername(oldName, newName) {
        const allMessages = document.querySelectorAll('.msg');
        allMessages.forEach(msg => {
          const userSpan = msg.querySelector('.user');
          if (userSpan && userSpan.textContent === oldName) {
            userSpan.textContent = newName;
          }
        });
      }

      // ===== حفظ رسالة للاستخدام دون اتصال =====
      function saveMessageOffline(text) {
        const message = {
          text: text,
          time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}),
          timestamp: Date.now()
        };

        pendingMessages.push(message);
        localStorage.setItem('pendingMessages', JSON.stringify(pendingMessages));

        showSystemMsg(`💾 حفظت الرسالة (${pendingMessages.length})`, true);
      }

      // ===== إعادة إرسال الرسائل المحفوظة =====
      function resendPendingMessages() {
        if (pendingMessages.length === 0 || !isConnected) return;

        const pendingCount = pendingMessages.length;
        showSystemMsg(`📤 إعادة إرسال ${pendingCount} رسالة...`, true);

        const messagesToSend = [...pendingMessages];
        pendingMessages = [];
        localStorage.setItem('pendingMessages', JSON.stringify(pendingMessages));

        messagesToSend.forEach((msg, index) => {
          setTimeout(() => {
            if (isConnected) {
              messagesRef.push().set({
                user: username,
                userId: userId,
                text: msg.text,
                time: msg.time,
                timestamp: firebase.database.ServerValue.TIMESTAMP
              });

              if (index === messagesToSend.length - 1) {
                showSystemMsg(`✅ تم إرسال ${messagesToSend.length} رسالة`, true);
              }
            } else {
              pendingMessages.push(msg);
              localStorage.setItem('pendingMessages', JSON.stringify(pendingMessages));
            }
          }, index * 800);
        });
      }

      // ===== إرسال الرسالة =====
      inputAreaForm.onsubmit = sendMessage;

      messageInput.oninput = () => {
        clearTimeout(typingTimer);

        if (isConnected && !isTypingLocally) {
          isTypingLocally = true;
          myTypingRef.set({
            name: username,
            ts: firebase.database.ServerValue.TIMESTAMP
          });
        }

        typingTimer = setTimeout(() => {
          isTypingLocally = false;
          if (isConnected) myTypingRef.remove();
        }, 2000);
      };

      function stopTypingNow() {
        clearTimeout(typingTimer);
        isTypingLocally = false;
        if (isConnected) myTypingRef.remove();
      }

      function sendMessage() {
        stopTypingNow();

        const text = messageInput.value.trim();
        if (!text) {
          showSystemMsg('⚠️ اكتب شيئاً', true);
          return;
        }

        if (text.length > 1000) {
          showSystemMsg('⚠️ الرسالة طويلة جداً', true);
          return;
        }

        if (!isConnected) {
          saveMessageOffline(text);
          messageInput.value = "";
          return;
        }

        const time = new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});

        messagesRef.push().set({
          user: username,
          userId: userId,
          text: text,
          time: time,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });

        messageInput.value = "";
        cleanupOldMessages();
      }

      // ===== عرض الرسائل =====
      messagesRef.limitToLast(50).on("child_added", snap => {
        addMessage(snap.key, snap.val());
      });

      messagesRef.on('child_removed', snap => {
        const el = document.getElementById('msg-' + snap.key);
        if (el) el.remove();
      });

      function addMessage(key, { user, userId: msgUserId, text, time, timestamp }) {
        const div = document.createElement("div");
        div.className = "msg";
        div.id = 'msg-' + key;

        const userSpan = document.createElement("span");
        userSpan.className = "user";
        userSpan.textContent = user;

        if (msgUserId === userId) {
          userSpan.onclick = (e) => {
            e.stopPropagation();
            const newName = prompt('الاسم الجديد:', user);
            if (newName && newName.trim() !== '') {
              changeUsername(newName.trim());
            }
          };
        } else {
          userSpan.style.cursor = 'default';
        }

        const textSpan = document.createElement("span");
        textSpan.className = "text";
        textSpan.textContent = text;

        const ts = timestamp || Date.now();
        const timeSpan = document.createElement("span");
        timeSpan.className = "time";
        timeSpan.dataset.timestamp = ts;
        timeSpan.textContent = formatRelativeTime(ts) || time;
        timeSpan.title = time || new Date(ts).toLocaleTimeString();

        div.appendChild(userSpan);
        div.appendChild(textSpan);
        div.appendChild(timeSpan);

        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      // ===== تحديث دوري لأوقات الرسائل =====
      setInterval(() => {
        document.querySelectorAll('#messages .time[data-timestamp]').forEach(el => {
          const ts = parseInt(el.dataset.timestamp, 10);
          if (!isNaN(ts)) {
            el.textContent = formatRelativeTime(ts);
          }
        });
      }, 20000);

      // ===== تنظيف الرسائل القديمة =====
      function cleanupOldMessages() {
        if (!isConnected) return;

        messagesRef.once('value', snapshot => {
          if (snapshot.numChildren() > 50) {
            let updates = {};
            let removeCount = 0;
            const limit = snapshot.numChildren() - 50;
            snapshot.forEach(child => {
              if (removeCount < limit) {
                updates[child.key] = null;
              }
              removeCount++;
            });
            messagesRef.update(updates);
          }
        });
      }

      // ===== رسائل النظام =====
      function showSystemMsg(text, isTemporary) {
        const div = document.createElement("div");
        div.className = "sys";
        div.textContent = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        if (isTemporary) {
          setTimeout(() => {
            div.classList.add('fade-out');
            setTimeout(() => div.remove(), 500);
          }, 4000);
        }
      }

      // ===== إصلاح مشكلة تكبير مربع الإدخال =====
      let inputFocused = false;

      messageInput.addEventListener('focus', function() {
        inputFocused = true;
        setTimeout(() => {
          if (inputFocused) {
            this.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      });

      messageInput.addEventListener('blur', function() {
        inputFocused = false;
        stopTypingNow();
        setTimeout(() => {
          window.scrollTo(0, 0);
        }, 100);
      });

      window.addEventListener('focusin', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          e.preventDefault();
        }
      });

      let lastHeight = window.innerHeight;
      window.addEventListener('resize', function() {
        const currentHeight = window.innerHeight;
        const isKeyboardOpen = currentHeight < lastHeight;

        if (isKeyboardOpen && document.activeElement === messageInput) {
          setTimeout(() => {
            messageInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }

        lastHeight = currentHeight;
      });

      // ===== إيقاف حالة الكتابة عند إخفاء التبويب =====
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopTypingNow();
        }
      });

      // ===== رسالة ترحيب =====
      setTimeout(() => {
        showSystemMsg(`🔓 مرحباً ${username}`, true);
        setTimeout(() => {
          showSystemMsg(`💡 انقر على اسمك لتغييره`, true);
        }, 1200);
        setTimeout(() => {
          if (pendingMessages.length > 0) {
            showSystemMsg(`📦 ${pendingMessages.length} رسالة محفوظة`, true);
          }
        }, 2000);
      }, 500);
    });
  </script>
</body>
