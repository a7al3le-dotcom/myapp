<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شات خاص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
--bg:#07080d;
--panel:#0d0f17;
--panel2:#131622;
--input:#10131d;
--text:#f7f7f8;
--muted:#9298a8;
--accent:#ffd54a;
--blue:#45a3ff;
--green:#32d583;
--red:#ff5c5c;
--border:rgba(255,255,255,.07)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:Tajawal,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button{border:0}
.hidden{display:none!important}

#app{height:100dvh;display:flex;flex-direction:column;min-height:0}
#loginScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.login-box{width:min(360px,100%);background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:28px 22px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.login-box h2{margin:0 0 8px;font-size:23px}
.login-box p{margin:0 0 20px;color:var(--muted);font-size:13px}
#usernameInput{width:100%;height:48px;border-radius:15px;border:1px solid var(--border);outline:0;background:#080a10;color:#fff;padding:0 15px;font-size:16px;text-align:right}
#loginBtn{width:100%;height:48px;margin-top:10px;border-radius:15px;background:var(--accent);color:#111;font-weight:700;font-size:16px;cursor:pointer}

#chat{display:flex;flex-direction:column;height:100%;min-height:0}
#header{height:58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:rgba(9,10,16,.96);border-bottom:1px solid var(--border);z-index:20}
.header-title{font-weight:700;font-size:17px}
.header-actions{display:flex;gap:7px}
.header-btn{height:38px;min-width:38px;padding:0 11px;border-radius:13px;background:var(--panel2);color:#fff;border:1px solid var(--border);cursor:pointer}
.online-count{color:var(--accent);font-weight:700;margin-right:3px}

#messages{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 12px 8px;scroll-behavior:auto}
.message{display:flex;align-items:flex-start;gap:8px;margin:7px 0;direction:ltr;animation:messageIn .14s ease-out}
@keyframes messageIn{from{opacity:.4;transform:translateY(2px)}to{opacity:1;transform:none}}
.message-name{color:var(--accent);font-weight:700;white-space:nowrap;max-width:125px;overflow:hidden;text-overflow:ellipsis}
.message-body{min-width:0;flex:1;text-align:left;direction:auto;word-break:break-word;white-space:pre-wrap;line-height:1.5;font-size:15px}
.message-meta{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--muted);font-size:10px;direction:ltr;padding-top:3px}
.message-check{font-family:Arial,sans-serif;font-size:13px;letter-spacing:-3px;margin-left:1px;color:#8f96a5;min-width:17px}
.message-check.read{color:var(--blue)}
.message-check.sent{color:#a5abb9}
.message-check.delivered{color:#a5abb9}
.system-message{width:max-content;max-width:90%;margin:9px auto;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.04);color:var(--muted);font-size:11px;text-align:center}

#typingArea{min-height:0;display:flex;align-items:center;padding:0 14px;overflow:hidden;transition:height .15s ease}
#typingIndicator{display:flex;align-items:center;gap:7px;min-height:28px;color:var(--muted);font-size:12px;opacity:0;transform:translateY(4px);transition:opacity .15s ease,transform .15s ease}
#typingIndicator.visible{opacity:1;transform:none}
.typing-dots{display:flex;gap:3px;direction:ltr}
.typing-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:typingDot 1.1s infinite ease-in-out}
.typing-dots i:nth-child(2){animation-delay:.15s}
.typing-dots i:nth-child(3){animation-delay:.3s}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}

#inputArea{display:flex;align-items:flex-end;gap:7px;padding:7px 10px calc(8px + env(safe-area-inset-bottom));background:#090a10;border-top:1px solid var(--border);z-index:20}
#messageInput{flex:1;min-width:0;max-height:120px;min-height:44px;height:44px;resize:none;outline:0;border:1px solid var(--border);border-radius:17px;background:var(--input);color:#fff;padding:11px 14px;font-size:16px;line-height:21px;overflow-y:auto}
#messageInput:focus{border-color:rgba(255,213,74,.35)}
#sendBtn{height:44px;min-width:58px;border-radius:15px;background:var(--accent);color:#111;font-weight:700;cursor:pointer}
#sendBtn:disabled{opacity:.45;cursor:default}
#charCount{position:absolute;bottom:3px;left:76px;color:var(--muted);font-size:9px;pointer-events:none}

#overlay{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:90;display:none}
.modal{position:fixed;z-index:100;left:50%;top:50%;transform:translate(-50%,-50%);width:min(370px,calc(100% - 28px));max-height:80dvh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:18px;display:none;box-shadow:0 20px 80px rgba(0,0,0,.55)}
.modal h3{margin:0 0 14px;font-size:17px}
.modal input{width:100%;height:45px;border-radius:13px;background:#080a10;border:1px solid var(--border);outline:0;color:#fff;padding:0 12px}
.modal-actions{display:flex;gap:8px;margin-top:10px}
.modal-actions button{flex:1;height:43px;border-radius:13px;cursor:pointer}
.primary{background:var(--accent);color:#111;font-weight:700}
.secondary{background:var(--panel2);color:#fff;border:1px solid var(--border)!important}

.user-row{display:flex;align-items:center;gap:9px;padding:9px 3px;border-bottom:1px solid rgba(255,255,255,.045)}
.user-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.user-name{font-size:14px}
.user-you{color:var(--muted);font-size:10px;margin-right:auto}

#videoPlayer{position:fixed;z-index:80;left:50%;top:72px;transform:translateX(-50%);width:min(94vw,560px);background:#000;border-radius:17px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.65);display:none}
.video-head{height:43px;background:#141620;display:flex;align-items:center;justify-content:space-between;padding:0 9px}
.video-title{font-size:13px}
.video-close{width:31px;height:31px;border-radius:50%;background:var(--red);color:#fff;cursor:pointer;font-size:15px}
.video-body{aspect-ratio:16/9;background:#000}
.video-body video{display:block;width:100%;height:100%;object-fit:contain}
.video-body iframe{display:block;width:100%;height:100%;border:0}
.video-error{padding:15px;background:#10090a;color:#ffb1b1;font-size:12px;line-height:1.5}

@media(max-width:600px){
#header{height:55px;min-height:55px}
#messages{padding:9px 9px 5px}
.message{gap:6px;margin:6px 0}
.message-name{max-width:95px}
.message-body{font-size:14px}
.header-btn{height:36px;min-width:36px;padding:0 9px}
#videoPlayer{width:96vw;top:62px}
}
</style>
</head>
<body>

<div id="loginScreen">
<div class="login-box">
<h2>👋 أهلاً بك</h2>
<p>اختر اسمك للدخول إلى الدردشة</p>
<input id="usernameInput" maxlength="20" autocomplete="nickname" placeholder="اسمك">
<button id="loginBtn">دخول</button>
</div>
</div>

<div id="app" class="hidden">
<div id="chat">
<header id="header">
<div class="header-title">ياسي</div>
<div class="header-actions">
<button class="header-btn" id="videoBtn" type="button">📺</button>
<button class="header-btn" id="usersBtn" type="button">👥 <span class="online-count" id="onlineCount">0</span></button>
</div>
</header>

<div id="videoPlayer"></div>

<main id="messages"></main>

<div id="typingArea">
<div id="typingIndicator">
<span id="typingText"></span>
<span class="typing-dots"><i></i><i></i><i></i></span>
</div>
</div>

<form id="inputArea">
<textarea id="messageInput" maxlength="1000" rows="1" autocomplete="off" placeholder="اكتب رسالتك..."></textarea>
<button id="sendBtn" type="submit">إرسال</button>
</form>
</div>
</div>

<div id="overlay"></div>

<div class="modal" id="usersModal">
<h3>المتصلون</h3>
<div id="usersList"></div>
<div class="modal-actions"><button class="secondary" type="button" data-close>إغلاق</button></div>
</div>

<div class="modal" id="videoModal">
<h3>تثبيت فيديو</h3>
<input id="videoUrl" type="url" placeholder="YouTube أو MP4 أو M3U8">
<div class="modal-actions">
<button class="secondary" type="button" data-close>إلغاء</button>
<button class="primary" type="button" id="saveVideo">تثبيت</button>
</div>
</div>

<script>
"use strict";

  const firebaseConfig = {
    apiKey: "AIzaSyB1AsEHXP05nQ8M66jYPusheLaE60q_JwU",
    authDomain: "mychat-2d881.firebaseapp.com",
    databaseURL: "https://mychat-2d881-default-rtdb.firebaseio.com"
  };

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=id=>document.getElementById(id);

const els={
login:$("loginScreen"),
loginInput:$("usernameInput"),
loginBtn:$("loginBtn"),
app:$("app"),
messages:$("messages"),
input:$("messageInput"),
form:$("inputArea"),
send:$("sendBtn"),
count:$("onlineCount"),
typingArea:$("typingArea"),
typing:$("typingIndicator"),
typingText:$("typingText"),
usersBtn:$("usersBtn"),
usersModal:$("usersModal"),
usersList:$("usersList"),
videoBtn:$("videoBtn"),
videoModal:$("videoModal"),
videoUrl:$("videoUrl"),
saveVideo:$("saveVideo"),
overlay:$("overlay"),
player:$("videoPlayer"),
charCount:$("charCount")
};

const CONFIG={
maxMessageLength:1000,
maxNameLength:20,
initialMessages:50,
typingStopDelay:1800,
typingRefreshDelay:2500,
readDelay:350,
presenceInterval:60000,
onlineTimeout:120000
};

let uid="";
let username="";
let serverOffset=0;
let messagesRef=null;
let onlineRef=null;
let typingRef=null;
let videoRef=null;
let connectedRef=null;
let presenceRef=null;

let typingTimer=0;
let typingRefreshTimer=0;
let readTimer=0;
let presenceTimer=0;
let currentVideo=null;

const messageNodes=new Map();
const messageData=new Map();
const deliveredCache=new Set();
const readCache=new Set();
const pendingRead=new Set();

function createUid(){
let id=localStorage.getItem("yasi_uid");
if(!/^[a-zA-Z0-9_-]{16,64}$/.test(id||"")){
id=crypto?.randomUUID?.().replace(/-/g,"")||Math.random().toString(36).slice(2)+Date.now().toString(36);
localStorage.setItem("yasi_uid",id);
}
return id;
}

function validName(value){
return /^[\p{L}\p{N}_ -]{2,20}$/u.test(value);
}

function escapeText(value){
return String(value??"");
}

function isNearBottom(){
return els.messages.scrollHeight-els.messages.scrollTop-els.messages.clientHeight<100;
}

function scrollBottom(force=false){
if(force||isNearBottom())requestAnimationFrame(()=>{els.messages.scrollTop=els.messages.scrollHeight});
}

function formatTime(timestamp){
const d=new Date(Number(timestamp));
if(!Number.isFinite(d.getTime()))return "";
return d.toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit",hour12:false});
}

function createMessageNode(key,data){
if(messageNodes.has(key))return messageNodes.get(key);

const row=document.createElement("div");
row.className="message";
row.dataset.id=key;

const name=document.createElement("span");
name.className="message-name";
name.textContent=escapeText(data.user);

const body=document.createElement("span");
body.className="message-body";
body.textContent=escapeText(data.text);

const meta=document.createElement("span");
meta.className="message-meta";

const time=document.createElement("span");
time.textContent=formatTime(data.timestamp);

const checks=document.createElement("span");
checks.className="message-check";

if(data.uid===uid){
checks.textContent="✓";
checks.classList.add("sent");
}

meta.append(time,checks);
row.append(name,body,meta);

messageNodes.set(key,row);
messageData.set(key,data);
els.messages.appendChild(row);

updateMessageStatus(key,data);
return row;
}

function updateMessageStatus(key,data){
const node=messageNodes.get(key);
if(!node||data.uid!==uid)return;

const checks=node.querySelector(".message-check");
if(!checks)return;

const delivered=data.deliveredBy&&Object.keys(data.deliveredBy).some(id=>id!==uid);
const read=data.readBy&&Object.keys(data.readBy).some(id=>id!==uid);

checks.className="message-check";

if(read){
checks.textContent="✓✓";
checks.classList.add("read");
}else if(delivered){
checks.textContent="✓✓";
checks.classList.add("delivered");
}else{
checks.textContent="✓";
checks.classList.add("sent");
}
}

function handleMessageAdded(snapshot){
const key=snapshot.key;
const data=snapshot.val();

if(!data||typeof data!=="object")return;
if(typeof data.text!=="string"||typeof data.user!=="string")return;
if(data.text.length>CONFIG.maxMessageLength)return;

const item={
uid:String(data.uid||""),
user:String(data.user||""),
text:data.text,
timestamp:Number(data.timestamp)||Date.now(),
deliveredBy:data.deliveredBy||{},
readBy:data.readBy||{}
};

const exists=messageNodes.has(key);

if(!exists)createMessageNode(key,item);

messageData.set(key,item);
updateMessageStatus(key,item);

if(item.uid!==uid){
markDelivered(key,item);
if(isNearBottom())scheduleRead(key);
}

if(!exists)scrollBottom();
}

function handleMessageChanged(snapshot){
const key=snapshot.key;
const data=snapshot.val();
if(!data||typeof data!=="object")return;

const node=messageNodes.get(key);
if(!node)return;

const item=messageData.get(key)||{};
item.deliveredBy=data.deliveredBy||{};
item.readBy=data.readBy||{};
messageData.set(key,item);
updateMessageStatus(key,item);

if(item.uid!==uid&&isNearBottom())scheduleRead(key);
}

function handleMessageRemoved(snapshot){
const key=snapshot.key;
const node=messageNodes.get(key);
if(node)node.remove();
messageNodes.delete(key);
messageData.delete(key);
deliveredCache.delete(key);
readCache.delete(key);
pendingRead.delete(key);
}

function markDelivered(key,data){
if(data.uid===uid||deliveredCache.has(key))return;
if(data.deliveredBy&&data.deliveredBy[uid]){deliveredCache.add(key);return}

deliveredCache.add(key);
messagesRef.child(key).child("deliveredBy").child(uid).set(firebase.database.ServerValue.TIMESTAMP).catch(()=>deliveredCache.delete(key));
}

function scheduleRead(key){
pendingRead.add(key);
clearTimeout(readTimer);
readTimer=setTimeout(flushReads,CONFIG.readDelay);
}

function flushReads(){
const ids=[...pendingRead];
pendingRead.clear();

ids.forEach(key=>{
const data=messageData.get(key);
if(!data||data.uid===uid)return;
if(readCache.has(key))return;
if(data.readBy&&data.readBy[uid]){readCache.add(key);return}

readCache.add(key);

messagesRef.child(key).child("readBy").child(uid).set(firebase.database.ServerValue.TIMESTAMP).catch(()=>readCache.delete(key));
});
}

function markVisibleMessagesRead(){
if(!isNearBottom())return;

for(const [key,data] of messageData){
if(data.uid!==uid)scheduleRead(key);
}
}

function updateTypingUI(users){
const names=Object.entries(users||{})
.filter(([id,value])=>id!==uid&&value&&Number(value.time)>Date.now()+serverOffset-5000)
.map(([,value])=>String(value.name||""))
.filter(Boolean)
.slice(0,3);

if(!names.length){
els.typing.classList.remove("visible");
els.typingArea.style.height="0px";
return;
}

els.typingText.textContent=
names.length===1?`${names[0]} يكتب الآن`:
names.length===2?`${names[0]} و${names[1]} يكتبان الآن`:
"عدة أشخاص يكتبون الآن";

els.typingArea.style.height="30px";
requestAnimationFrame(()=>els.typing.classList.add("visible"));
}

function startTyping(){
if(!username)return;

const hasText=els.input.value.trim().length>0;

if(!hasText){
stopTyping();
return;
}

if(!typingRef)return;

if(!typingTimer){
typingRef.child(uid).set({
name:username,
time:firebase.database.ServerValue.TIMESTAMP
}).catch(()=>{});
}

clearTimeout(typingTimer);
typingTimer=setTimeout(()=>{
typingRef.child(uid).remove().catch(()=>{});
typingTimer=0;
},CONFIG.typingStopDelay);

clearTimeout(typingRefreshTimer);
typingRefreshTimer=setTimeout(()=>{
typingTimer=0;
startTyping();
},CONFIG.typingRefreshDelay);
}

function stopTyping(){
clearTimeout(typingTimer);
clearTimeout(typingRefreshTimer);
typingTimer=0;
typingRefreshTimer=0;
if(typingRef)typingRef.child(uid).remove().catch(()=>{});
}

function updateInput(){
const value=els.input.value;
els.send.disabled=!value.trim();

els.input.style.height="44px";
const h=Math.min(els.input.scrollHeight,120);
els.input.style.height=h+"px";
}

function cleanPresence(){
const now=Date.now()+serverOffset;
onlineRef.once("value").then(snapshot=>{
const updates={};

snapshot.forEach(child=>{
const value=child.val();
if(!value||now-Number(value.lastActive||0)>CONFIG.onlineTimeout){
updates[child.key]=null;
}
});

if(Object.keys(updates).length)onlineRef.update(updates).catch(()=>{});
}).catch(()=>{});
}

function renderUsers(data){
els.usersList.textContent="";

const users=Object.entries(data||{})
.sort((a,b)=>String(a[1]?.name||"").localeCompare(String(b[1]?.name||""),"ar"));

users.forEach(([id,value])=>{
if(!value)return;

const row=document.createElement("div");
row.className="user-row";

const dot=document.createElement("span");
dot.className="user-dot";

const name=document.createElement("span");
name.className="user-name";
name.textContent=String(value.name||"مستخدم");

const you=document.createElement("span");
you.className="user-you";

if(id===uid)you.textContent="أنت";

row.append(dot,name,you);
els.usersList.appendChild(row);
});

els.count.textContent=String(users.length);
}

function openModal(modal){
els.overlay.style.display="block";
modal.style.display="block";
}

function closeModals(){
els.overlay.style.display="none";
els.usersModal.style.display="none";
els.videoModal.style.display="none";
}

function getYoutubeId(url){
try{
const u=new URL(url);
if(u.hostname==="youtu.be")return u.pathname.slice(1).split("/")[0]||null;
if(u.hostname.includes("youtube.com"))return u.searchParams.get("v")||u.pathname.split("/").filter(Boolean).pop()||null;
}catch(e){}
return null;
}

function isM3u8(url){
return /\.m3u8(?:[?#].*)?$/i.test(url);
}

function isDirectVideo(url){
return /\.(mp4|webm|m4v|mov)(?:[?#].*)?$/i.test(url);
}

function destroyVideo(){
if(currentVideo){
try{currentVideo.pause()}catch(e){}
try{currentVideo.removeAttribute("src");currentVideo.load()}catch(e){}
currentVideo.remove();
currentVideo=null;
}
els.player.textContent="";
els.player.style.display="none";
}

function showVideo(data){
destroyVideo();

if(!data||!data.url)return;

els.player.style.display="block";

const head=document.createElement("div");
head.className="video-head";

const title=document.createElement("span");
title.className="video-title";
title.textContent=`📺 ${String(data.by||"")}`;

const close=document.createElement("button");
close.className="video-close";
close.type="button";
close.textContent="×";
close.onclick=()=>videoRef.remove().catch(()=>{});

head.append(title,close);

const body=document.createElement("div");
body.className="video-body";

els.player.append(head,body);

const youtube=getYoutubeId(data.url);

if(youtube){
const iframe=document.createElement("iframe");
iframe.src=`https://www.youtube.com/embed/${encodeURIComponent(youtube)}?playsinline=1&rel=0`;
iframe.allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture";
iframe.allowFullscreen=true;
iframe.loading="lazy";
body.appendChild(iframe);
return;
}

if(isM3u8(data.url)){
const video=document.createElement("video");
video.controls=true;
video.playsInline=true;
video.preload="metadata";
video.src=data.url;
body.appendChild(video);
currentVideo=video;
return;
}

if(isDirectVideo(data.url)){
const video=document.createElement("video");
video.controls=true;
video.playsInline=true;
video.preload="metadata";
video.src=data.url;
body.appendChild(video);
currentVideo=video;
return;
}

const error=document.createElement("div");
error.className="video-error";
error.textContent="الرابط غير مدعوم.";
body.appendChild(error);
}

async function sendMessage(){
const text=els.input.value.trim();

if(!text||text.length>CONFIG.maxMessageLength)return;
if(!messagesRef||!connected)return;

els.send.disabled=true;
stopTyping();

const ref=messagesRef.push();

const payload={
uid,
user:username,
text,
timestamp:firebase.database.ServerValue.TIMESTAMP,
deliveredBy:{[uid]:firebase.database.ServerValue.TIMESTAMP}
};

try{
await ref.set(payload);
els.input.value="";
updateInput();
scrollBottom(true);
}catch(e){
showSystem("تعذر إرسال الرسالة");
}
finally{
updateInput();
}
}

function showSystem(text){
const el=document.createElement("div");
el.className="system-message";
el.textContent=text;
els.messages.appendChild(el);
scrollBottom(true);
setTimeout(()=>el.remove(),3500);
}

let connected=false;

function setupPresence(){
presenceRef=onlineRef.child(uid);

presenceRef.onDisconnect().remove().catch(()=>{});

const writePresence=()=>{
presenceRef.set({
name:username,
lastActive:firebase.database.ServerValue.TIMESTAMP
}).catch(()=>{});
};

writePresence();

clearInterval(presenceTimer);
presenceTimer=setInterval(()=>{
if(document.hidden)return;
writePresence();
},CONFIG.presenceInterval);
}

function setupFirebase(){
messagesRef=db.ref("messages");
onlineRef=db.ref("online");
typingRef=db.ref("typing");
videoRef=db.ref("pinned_video");
connectedRef=db.ref(".info/connected");

db.ref(".info/serverTimeOffset").on("value",snapshot=>{
serverOffset=Number(snapshot.val()||0);
});

connectedRef.on("value",snapshot=>{
const state=snapshot.val()===true;

if(state===connected)return;
connected=state;

if(state){
setupPresence();
showSystem("متصل");
}else{
showSystem("انقطع الاتصال");
}
});

messagesRef.limitToLast(CONFIG.initialMessages).on("child_added",handleMessageAdded);
messagesRef.limitToLast(CONFIG.initialMessages).on("child_changed",handleMessageChanged);
messagesRef.limitToLast(CONFIG.initialMessages).on("child_removed",handleMessageRemoved);

onlineRef.on("value",snapshot=>{
renderUsers(snapshot.val());
});

typingRef.on("value",snapshot=>{
updateTypingUI(snapshot.val());
});

videoRef.on("value",snapshot=>{
showVideo(snapshot.val());
});

setTimeout(cleanPresence,3000);
}

function login(){
const value=els.loginInput.value.trim();

if(!validName(value)){
alert("الاسم يجب أن يكون بين حرفين و20 حرفاً.");
return;
}

uid=createUid();
username=value;

localStorage.setItem("yasi_username",username);

els.login.classList.add("hidden");
els.app.classList.remove("hidden");

setupFirebase();
els.input.focus();
}

els.loginBtn.addEventListener("click",login);

els.loginInput.addEventListener("keydown",e=>{
if(e.key==="Enter"){
e.preventDefault();
login();
}
});

els.form.addEventListener("submit",e=>{
e.preventDefault();
sendMessage();
});

els.input.addEventListener("input",()=>{
updateInput();
startTyping();
});

els.input.addEventListener("keydown",e=>{
if(e.key==="Enter"&&!e.shiftKey){
e.preventDefault();
sendMessage();
}
});

els.messages.addEventListener("scroll",()=>{
if(isNearBottom())markVisibleMessagesRead();
});

els.usersBtn.addEventListener("click",()=>{
openModal(els.usersModal);
});

els.videoBtn.addEventListener("click",()=>{
els.videoUrl.value="";
openModal(els.videoModal);
setTimeout(()=>els.videoUrl.focus(),50);
});

els.overlay.addEventListener("click",closeModals);

document.querySelectorAll("[data-close]").forEach(btn=>{
btn.addEventListener("click",closeModals);
});

els.saveVideo.addEventListener("click",async()=>{
const url=els.videoUrl.value.trim();

if(!url)return;

const youtube=getYoutubeId(url);

if(!youtube&&!isM3u8(url)&&!isDirectVideo(url)){
alert("الرابط غير مدعوم.");
return;
}

try{
await videoRef.set({
url,
by:username,
timestamp:firebase.database.ServerValue.TIMESTAMP
});
closeModals();
}catch(e){
alert("تعذر تثبيت الفيديو.");
}
});

document.addEventListener("visibilitychange",()=>{
if(document.hidden){
stopTyping();
clearTimeout(readTimer);
}else{
if(connected){
presenceRef?.set({
name:username,
lastActive:firebase.database.ServerValue.TIMESTAMP
}).catch(()=>{});
}
markVisibleMessagesRead();
}
});

window.addEventListener("pagehide",()=>{
stopTyping();
clearInterval(presenceTimer);
});

window.addEventListener("resize",()=>{
if(document.activeElement===els.input){
requestAnimationFrame(()=>{
els.messages.scrollTop=els.messages.scrollHeight;
});
}
});

(function restore(){
const savedName=localStorage.getItem("yasi_username");
if(savedName&&validName(savedName)){
els.loginInput.value=savedName;
}
updateInput();
})();
</script>
</body>
</html>
