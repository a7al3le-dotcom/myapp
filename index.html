<style>

#inputArea::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,rgba(245,185,66,.28),transparent);pointer-events:none}

#messageInput:hover{border-color:#323842}#messageInput:focus{background:#101319;border-color:rgba(245,185,66,.55);box-shadow:0 0 0 3px rgba(245,185,66,.07),0 8px 24px rgba(0,0,0,.2)}#messageInput::placeholder{color:#646b76;opacity:1}
#sendBtn{position:relative;flex:0 0 auto;height:46px;min-width:82px;padding:7px 15px;border:1px solid rgba(245,185,66,.55);border-radius:14px;outline:none;background:linear-gradient(180deg,#dca53b,#b97918);color:#171107;cursor:pointer;font-family:"Tajawal",Arial,sans-serif;font-size:13px;font-weight:700;touch-action:manipulation;box-shadow:0 6px 18px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
#sendBtn:hover,#sendBtn:focus-visible{filter:brightness(1.08);box-shadow:0 8px 24px rgba(0,0,0,.28),0 0 20px rgba(245,185,66,.12),inset 0 1px 0 rgba(255,255,255,.2)}#sendBtn:active{transform:translateY(1px) scale(.98)}#sendBtn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
#onlineList{position:fixed;top:10px;right:10px;z-index:1000;display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(16,19,25,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text-soft);font-family:"Tajawal",Arial,sans-serif;font-size:12px;cursor:pointer;user-select:none;box-shadow:0 8px 25px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.025);transition:.2s}
#onlineList i{color:var(--gold);font-size:13px}#onlineList #count{color:var(--gold-soft);font-weight:700;font-variant-numeric:tabular-nums}#onlineList:hover,#onlineList:focus-visible{background:rgba(23,26,33,.97);border-color:rgba(245,185,66,.42);color:var(--text)}
#usersBox{position:fixed;top:55px;right:10px;z-index:999;min-width:190px;max-width:260px;max-height:300px;padding:10px;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,rgba(20,24,32,.98),rgba(12,14,19,.98));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--text);box-shadow:var(--shadow),0 0 30px rgba(0,0,0,.25);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-6px) scale(.98);transform-origin:top right;transition:opacity .18s ease,visibility .18s ease,transform .18s ease}
#usersBox.visible{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(0) scale(1)}#usersBox h4{margin:0 0 8px;padding:7px 8px 9px;border-bottom:1px solid var(--border-soft);color:var(--text);font-size:13px;font-weight:700}#usersList{max-height:225px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--gold-dark) transparent}
#usersList::-webkit-scrollbar{width:4px}#usersList::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:10px}.user-item{display:flex;align-items:center;gap:8px;padding:8px 7px;border-bottom:1px solid rgba(255,255,255,.035);border-radius:9px;font-size:12px}.user-item:last-child{border-bottom:0}.user-item:hover{background:rgba(255,255,255,.025)}.user-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-soft);direction:rtl;unicode-bidi:plaintext}.status-indicator{width:8px;height:8px;flex:0 0 8px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}.status-green{background:#45d483;border-color:#45d483;box-shadow:0 0 8px rgba(69,212,131,.32)}.status-yellow{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px rgba(245,185,66,.28)}
#connection-status{position:fixed;bottom:78px;left:50%;z-index:999;display:none;transform:translateX(-50%);padding:7px 15px;border:1px solid var(--border);border-radius:10px;background:rgba(16,19,25,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow)}#connection-status.visible{display:block}#connection-status.online{color:#69d99a;border-color:rgba(69,212,131,.25)}#connection-status.offline{color:#ff7885;border-color:rgba(255,83,100,.25)}#connection-status.reconnecting{color:var(--gold-soft);border-color:rgba(245,185,66,.25)}
@media(max-width:768px){#messages{padding:58px 9px 10px}.msg{gap:6px;font-size:13px;margin:3px 0;padding:3px}.msg .time{font-size:9px}#inputArea{min-height:67px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));gap:7px}#messageInput{height:46px;padding:8px 13px;border-radius:14px;font-size:16px}#sendBtn{height:46px;min-width:76px;padding:7px 11px;border-radius:14px;font-size:13px}#onlineList{top:8px;right:8px;padding:7px 10px;border-radius:11px}#usersBox{top:51px;right:8px;max-width:calc(100vw - 16px);min-width:180px;max-height:290px}#connection-status{bottom:76px}#typingIndicator{padding-left:10px;padding-right:10px}}
@media(max-width:420px){#messages{padding-left:7px;padding-right:7px}#inputArea{padding-left:6px;padding-right:6px}#messageInput{padding-left:12px;padding-right:12px}#sendBtn{min-width:70px;padding-left:9px;padding-right:9px}#onlineList{font-size:11px;padding:6px 9px}}
@media(max-width:360px){#onlineList{font-size:10px;padding:6px 8px;gap:4px}#messageInput{height:44px;font-size:16px}#sendBtn{height:44px;min-width:65px;font-size:12px}#inputArea{min-height:63px}}

<body>
<div id="chat-container">
<div id="onlineList" title="المتصلون الآن" role="button" tabindex="0" aria-expanded="false"><i class="fa fa-users" aria-hidden="true"></i><span id="count">0</span><span>متصل</span></div>
<div id="usersBox" aria-hidden="true"><h4>🖥️ المتصلون</h4><div id="usersList"></div></div>
<div id="messages" aria-live="polite" aria-label="الرسائل"></div>
<div id="connection-status"></div>
<div id="typingIndicator" aria-live="polite"></div>
<form id="inputArea"><button type="submit" id="sendBtn">➤ إرسال</button><input type="text" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="true" maxlength="1000" aria-label="حقل إدخال الرسالة"></form>
</div>
<script>
"use strict";
document.addEventListener("DOMContentLoaded",async()=>{
const firebaseConfig={apiKey:"AIzaSyB1AsEHXP05nQ8M66jYPusheLaE60q_JwU",authDomain:"mychat-2d881.firebaseapp.com",databaseURL:"https://mychat-2d881-default-rtdb.firebaseio.com"};
try{firebase.initializeApp(firebaseConfig)}catch(error){console.error("Firebase initialization error:",error);showFatalError("تعذر تشغيل Firebase");return}
const auth=firebase.auth(),db=firebase.database();
const MAX_MESSAGE_LENGTH=1000,MAX_USERNAME_LENGTH=20,MAX_VISIBLE_MESSAGES=50,TYPING_TIMEOUT=2000,TYPING_STALE_TIME=10000,PRESENCE_INTERVAL=30000,INACTIVE_AFTER=120000,SEND_COOLDOWN=700,OFFLINE_QUEUE_KEY="chat_pending_messages_v2",USERNAME_KEY="chat_username_v2";
const onlineList=document.getElementById("onlineList"),usersBox=document.getElementById("usersBox"),usersList=document.getElementById("usersList"),onlineCountEl=document.getElementById("count"),messagesDiv=document.getElementById("messages"),connectionStatus=document.getElementById("connection-status"),typingIndicatorEl=document.getElementById("typingIndicator"),messageInput=document.getElementById("messageInput"),inputAreaForm=document.getElementById("inputArea"),sendBtn=document.getElementById("sendBtn");
let currentUser=null,username="",userRef=null,messagesRef=null,onlineRef=null,typingRef=null,myTypingRef=null,isConnected=false,isSending=false,typingTimer=null,serverTimeOffset=0,lastSendTime=0;
const onlineUsersCache=Object.create(null),typingUsersCache=Object.create(null),renderedMessageIds=new Set();let pendingMessages=[];
function showFatalError(message){document.body.innerHTML="";const box=document.createElement("div");box.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#08090c;color:#ff5364;font-family:monospace;text-align:center;direction:rtl";box.textContent=message;document.body.appendChild(box)}
function sanitizeUsername(value){return String(value||"").replace(/[\u0000-\u001F\u007F]/g,"").trim().slice(0,MAX_USERNAME_LENGTH)}
function generateUsername(){return"زائر"+Math.floor(1000+Math.random()*9000)}
function getSavedUsername(){try{const saved=localStorage.getItem(USERNAME_KEY),clean=sanitizeUsername(saved);if(clean)return clean}catch(error){console.warn("localStorage read failed:",error)}return generateUsername()}
function saveUsername(value){try{localStorage.setItem(USERNAME_KEY,value)}catch(error){console.warn("localStorage write failed:",error)}}
function getServerNow(){return Date.now()+serverTimeOffset}
const TIME_FORMS={seconds:{one:"ث",two:"ث",few:"ث",many:"ث"},minutes:{one:"د",two:"د",few:"د",many:"د"},hours:{one:"س",two:"س",few:"س",many:"س"},days:{one:"ي",two:"ي",few:"ي",many:"ي"}};
function formatUnit(number,forms){if(number===1)return"1 "+forms.one;if(number===2)return"2 "+forms.two;if(number>=3&&number<=10)return number+" "+forms.few;return number+" "+forms.many}
function formatRelativeTime(timestampMs){if(!timestampMs||!Number.isFinite(Number(timestampMs)))return"";const now=getServerNow();let diffSeconds=Math.floor((now-Number(timestampMs))/1000);if(diffSeconds<0)diffSeconds=0;if(diffSeconds<5)return"الآن";if(diffSeconds<60)return formatUnit(diffSeconds,TIME_FORMS.seconds);const minutes=Math.floor(diffSeconds/60);if(minutes<60)return formatUnit(minutes,TIME_FORMS.minutes);const hours=Math.floor(minutes/60);if(hours<24)return formatUnit(hours,TIME_FORMS.hours);return formatUnit(Math.floor(hours/24),TIME_FORMS.days)}
let statusTimer=null;
function showConnectionStatus(status,type){connectionStatus.textContent=status;connectionStatus.className="visible "+type;clearTimeout(statusTimer);if(type==="online")statusTimer=setTimeout(()=>{connectionStatus.className=""},2500)}
function loadPendingMessages(){try{const saved=localStorage.getItem(OFFLINE_QUEUE_KEY);if(!saved){pendingMessages=[];return}const parsed=JSON.parse(saved);if(!Array.isArray(parsed)){pendingMessages=[];return}pendingMessages=parsed.filter(item=>item&&typeof item.text==="string"&&item.text.length>0&&item.text.length<=MAX_MESSAGE_LENGTH&&typeof item.localId==="string")}catch(error){console.warn("Offline queue error:",error);pendingMessages=[]}}
function savePendingMessages(){try{localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(pendingMessages))}catch(error){console.warn("Could not save offline messages:",error)}}
function queueOfflineMessage(text){const item={localId:"local_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),text:text,createdAt:Date.now()};pendingMessages.push(item);if(pendingMessages.length>100)pendingMessages=pendingMessages.slice(-100);savePendingMessages();showSystemMsg("💾 حفظت الرسالة ("+pendingMessages.length+")",true)}
async function authenticate(){try{if(auth.currentUser){currentUser=auth.currentUser}else{const result=await auth.signInAnonymously();currentUser=result.user}if(!currentUser||!currentUser.uid)throw new Error("Authentication returned no user");return true}catch(error){console.error("Authentication failed:",error);showFatalError("تعذر تسجيل الدخول إلى النظام.\n\nتأكد من تفعيل Anonymous Authentication في Firebase.");return false}}
function initializeReferences(){const uid=currentUser.uid;userRef=db.ref("online/"+uid);messagesRef=db.ref("messages");onlineRef=db.ref("online");typingRef=db.ref("typing");myTypingRef=db.ref("typing/"+uid)}
let presenceSyncing=false,presenceHeartbeatTimer=null,presenceSweepTimer=null;

async function syncMyPresence(){
  if(!isConnected||!userRef||!currentUser||presenceSyncing)return;
  presenceSyncing=true;
  try{
    await userRef.onDisconnect().remove();
    if(myTypingRef)await myTypingRef.onDisconnect().remove();
    await userRef.set({
      name:username,
      joinedAt:firebase.database.ServerValue.TIMESTAMP,
      lastActive:firebase.database.ServerValue.TIMESTAMP
    });
    const localNow=getServerNow();
    onlineUsersCache[currentUser.uid]={
      name:username,
      joinedAt:localNow,
      lastActive:localNow
    };
    const ownItem=document.getElementById("user-"+currentUser.uid);
    if(ownItem)applyUserItemData(ownItem,currentUser.uid,onlineUsersCache[currentUser.uid]);
    updateOnlineCount();
    await resendPendingMessages();
  }catch(error){
    console.error("Presence sync error:",error);
    showConnectionStatus("⚠️ خطأ في الاتصال","reconnecting");
  }finally{
    presenceSyncing=false;
  }
}

async function setupPresence(){
  const connectedRef=db.ref(".info/connected");
  connectedRef.on("value",async snapshot=>{
    const connected=snapshot.val()===true;
    isConnected=connected;
    if(!connected){
      showConnectionStatus("⚠️ انقطع الاتصال، جاري إعادة الاتصال...","offline");
      return;
    }
    showConnectionStatus("✅ متصل","online");
    await syncMyPresence();
  });
  db.ref(".info/serverTimeOffset").on("value",snapshot=>{
    serverTimeOffset=Number(snapshot.val())||0;
    refreshOnlineUsers();
  });
}

function isUserActive(userData){
  const lastActive=Number(userData&&userData.lastActive)||0;
  return lastActive>0&&getServerNow()-lastActive<=INACTIVE_AFTER;
}

function updateOnlineCount(){
  let activeCount=0;
  Object.values(onlineUsersCache).forEach(userData=>{
    if(isUserActive(userData))activeCount++;
  });
  onlineCountEl.textContent=String(activeCount);
}

function refreshOnlineUsers(){
  Object.entries(onlineUsersCache).forEach(([userKey,userData])=>{
    const item=document.getElementById("user-"+userKey);
    if(isUserActive(userData)){
      if(item){
        applyUserItemData(item,userKey,userData);
      }else{
        const newItem=buildUserItem(userKey);
        applyUserItemData(newItem,userKey,userData);
        usersList.appendChild(newItem);
      }
    }else if(item){
      item.remove();
    }
  });
  updateOnlineCount();
}

function startPresenceHeartbeat(){
  if(presenceHeartbeatTimer)clearInterval(presenceHeartbeatTimer);
  presenceHeartbeatTimer=setInterval(()=>{
    if(!isConnected||!userRef)return;
    userRef.update({
      name:username,
      lastActive:firebase.database.ServerValue.TIMESTAMP
    }).then(()=>{
      const now=getServerNow();
      const cached=onlineUsersCache[currentUser.uid]||{};
      onlineUsersCache[currentUser.uid]={
        ...cached,
        name:username,
        lastActive:now
      };
      refreshOnlineUsers();
    }).catch(error=>console.warn("Presence heartbeat failed:",error));
  },PRESENCE_INTERVAL);
}

function startPresenceSweep(){
  if(presenceSweepTimer)clearInterval(presenceSweepTimer);
  presenceSweepTimer=setInterval(()=>{
    if(!currentUser)return;
    refreshOnlineUsers();
  },5000);
}

function buildUserItem(userKey){
  const item=document.createElement("div");
  item.className="user-item";
  item.id="user-"+userKey;
  const indicator=document.createElement("span");
  indicator.className="status-indicator";
  const name=document.createElement("span");
  name.className="user-name";
  item.appendChild(indicator);
  item.appendChild(name);
  return item
}

function applyUserItemData(item,userKey,userData){
  if(!item||!userData)return;
  const isMe=userKey===currentUser.uid,
        displayName=sanitizeUsername(userData.name)||"مستخدم",
        indicator=item.querySelector(".status-indicator"),
        name=item.querySelector(".user-name");
  if(indicator){
    indicator.classList.remove("status-green","status-yellow");
    indicator.classList.add("status-green");
  }
  if(name){
    name.textContent=isMe?displayName+" [أنت]":displayName;
    name.title=isMe?"أنت":"متصل";
  }
}

function handleUserAdded(snapshot){
  const key=snapshot.key,data=snapshot.val();
  if(!key||!data)return;
  onlineUsersCache[key]=data;
  const oldItem=document.getElementById("user-"+key);
  if(oldItem)oldItem.remove();
  if(isUserActive(data)){
    const item=buildUserItem(key);
    applyUserItemData(item,key,data);
    usersList.appendChild(item);
  }
  updateOnlineCount();
}

function handleUserChanged(snapshot){
  const key=snapshot.key,data=snapshot.val();
  if(!key||!data)return;
  onlineUsersCache[key]=data;
  const item=document.getElementById("user-"+key);
  if(isUserActive(data)){
    const activeItem=item||buildUserItem(key);
    applyUserItemData(activeItem,key,data);
    if(!item)usersList.appendChild(activeItem);
  }else if(item){
    item.remove();
  }
  updateOnlineCount();
}

function handleUserRemoved(snapshot){
  const key=snapshot.key;
  delete onlineUsersCache[key];
  const item=document.getElementById("user-"+key);
  if(item)item.remove();
  updateOnlineCount();
}

function setupOnlineListeners(){
  onlineRef.on("child_added",handleUserAdded);
  onlineRef.on("child_changed",handleUserChanged);
  onlineRef.on("child_removed",handleUserRemoved);
  startPresenceSweep();
}

function renderTypingIndicator(){const names=Object.entries(typingUsersCache).filter(([uid,data])=>uid!==currentUser.uid&&data&&typeof data.name==="string"&&data.name.trim()).map(([,data])=>sanitizeUsername(data.name)).filter(Boolean);if(names.length===0){typingIndicatorEl.classList.remove("visible");typingIndicatorEl.textContent="";return}let text;if(names.length===1)text=names[0]+" يكتب الآن...";else if(names.length===2)text=names[0]+" و "+names[1]+" يكتبان الآن...";else text="عدة أشخاص يكتبون الآن...";typingIndicatorEl.textContent=text;typingIndicatorEl.classList.add("visible")}
function setTyping(){if(!isConnected||!myTypingRef)return;clearTimeout(typingTimer);myTypingRef.set({name:username,ts:firebase.database.ServerValue.TIMESTAMP}).catch(error=>console.warn("Typing update failed:",error));typingTimer=setTimeout(stopTypingNow,TYPING_TIMEOUT)}
function stopTypingNow(){clearTimeout(typingTimer);if(!isConnected||!myTypingRef)return;myTypingRef.remove().catch(error=>console.warn("Typing removal failed:",error))}
function setupTypingListeners(){typingRef.on("child_added",snapshot=>{if(snapshot.key===currentUser.uid)return;typingUsersCache[snapshot.key]=snapshot.val();renderTypingIndicator()});typingRef.on("child_changed",snapshot=>{if(snapshot.key===currentUser.uid)return;typingUsersCache[snapshot.key]=snapshot.val();renderTypingIndicator()});typingRef.on("child_removed",snapshot=>{delete typingUsersCache[snapshot.key];renderTypingIndicator()})}
setInterval(()=>{const now=getServerNow();let changed=false;Object.keys(typingUsersCache).forEach(uid=>{const data=typingUsersCache[uid],ts=Number(data&&data.ts);if(ts&&now-ts>TYPING_STALE_TIME){delete typingUsersCache[uid];changed=true}});if(changed)renderTypingIndicator()},5000);
async function changeUsername(newName){newName=sanitizeUsername(newName);if(!newName){showSystemMsg("⚠️ الاسم لا يمكن أن يكون فارغًا",true);return}if(newName.length>MAX_USERNAME_LENGTH){showSystemMsg("⚠️ الاسم طويل جدًا (الحد "+MAX_USERNAME_LENGTH+" حرف)",true);return}if(newName===username)return;if(!isConnected){showSystemMsg("⚠️ يجب الاتصال بالإنترنت لتغيير الاسم",true);return}const oldName=username;username=newName;saveUsername(username);try{await userRef.update({name:username,lastActive:firebase.database.ServerValue.TIMESTAMP});showSystemMsg("✅ "+oldName+" → "+username,true);updateDisplayedOwnNames(oldName,username)}catch(error){username=oldName;saveUsername(username);showSystemMsg("❌ تعذر تغيير الاسم",true);console.error("Username update failed:",error)}}
function updateDisplayedOwnNames(oldName,newName){document.querySelectorAll(".msg.mine .user").forEach(element=>{if(element.textContent===oldName)element.textContent=newName})}
function isValidMessage(data){if(!data||typeof data!=="object")return false;if(typeof data.text!=="string"||data.text.length===0||data.text.length>MAX_MESSAGE_LENGTH)return false;return true}
function addMessage(key,data){if(!key||renderedMessageIds.has(key)||!isValidMessage(data))return;renderedMessageIds.add(key);const div=document.createElement("div");div.className="msg";div.id="msg-"+key;const msgUserId=typeof data.userId==="string"?data.userId:"",isMine=msgUserId===currentUser.uid;if(isMine)div.classList.add("mine");const userSpan=document.createElement("span");userSpan.className="user";userSpan.textContent=sanitizeUsername(data.user)||"مستخدم";if(isMine){userSpan.title="اضغط لتغيير اسمك";userSpan.addEventListener("click",event=>{event.stopPropagation();const newName=window.prompt("الاسم الجديد:",username);if(newName!==null)changeUsername(newName)})}const textSpan=document.createElement("span");textSpan.className="text";textSpan.textContent=data.text;const timestamp=Number(data.timestamp)||Date.now();const timeSpan=document.createElement("span");timeSpan.className="time";timeSpan.dataset.timestamp=String(timestamp);timeSpan.textContent=formatRelativeTime(timestamp)||data.time||"";timeSpan.title=data.time||new Date(timestamp).toLocaleTimeString();div.appendChild(userSpan);div.appendChild(textSpan);div.appendChild(timeSpan);messagesDiv.appendChild(div);const distanceFromBottom=messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight;if(distanceFromBottom<180)messagesDiv.scrollTop=messagesDiv.scrollHeight}
function setupMessageListeners(){messagesRef.limitToLast(MAX_VISIBLE_MESSAGES).on("child_added",snapshot=>addMessage(snapshot.key,snapshot.val()));messagesRef.on("child_removed",snapshot=>{const element=document.getElementById("msg-"+snapshot.key);if(element)element.remove();renderedMessageIds.delete(snapshot.key)})}
async function sendMessage(){stopTypingNow();const now=Date.now();if(now-lastSendTime<SEND_COOLDOWN)return;const text=messageInput.value.trim();if(!text){showSystemMsg("⚠️ اكتب شيئًا",true);return}if(text.length>MAX_MESSAGE_LENGTH){showSystemMsg("⚠️ الرسالة طويلة جدًا",true);return}lastSendTime=now;if(!isConnected){queueOfflineMessage(text);messageInput.value="";return}if(isSending)return;isSending=true;sendBtn.disabled=true;try{const newMessageRef=messagesRef.push();await newMessageRef.set({userId:currentUser.uid,user:username,text:text,timestamp:firebase.database.ServerValue.TIMESTAMP});messageInput.value=""}catch(error){console.error("Message send failed:",error);showSystemMsg("❌ تعذر إرسال الرسالة، تم حفظها للمحاولة لاحقًا",true);queueOfflineMessage(text)}finally{isSending=false;sendBtn.disabled=false}}
async function resendPendingMessages(){if(!isConnected||!messagesRef||pendingMessages.length===0)return;const queue=[...pendingMessages];showSystemMsg("📤 محاولة إرسال "+queue.length+" رسالة محفوظة...",true);for(const item of queue){if(!isConnected)break;try{const ref=messagesRef.push();await ref.set({userId:currentUser.uid,user:username,text:item.text,timestamp:firebase.database.ServerValue.TIMESTAMP});pendingMessages=pendingMessages.filter(msg=>msg.localId!==item.localId);savePendingMessages()}catch(error){console.warn("Pending message failed:",error);break}}if(pendingMessages.length===0)showSystemMsg("✅ تم إرسال الرسائل المحفوظة",true);else showSystemMsg("📦 بقيت "+pendingMessages.length+" رسالة محفوظة",true)}
inputAreaForm.addEventListener("submit",event=>{event.preventDefault();sendMessage()});
messageInput.addEventListener("input",()=>{if(messageInput.value.trim())setTyping();else stopTypingNow()});
messageInput.addEventListener("blur",stopTypingNow);
function toggleUsersBox(){const visible=usersBox.classList.toggle("visible");onlineList.setAttribute("aria-expanded",String(visible));usersBox.setAttribute("aria-hidden",String(!visible))}
onlineList.addEventListener("click",event=>{event.stopPropagation();toggleUsersBox()});
onlineList.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();toggleUsersBox()}});
usersBox.addEventListener("click",event=>event.stopPropagation());
document.addEventListener("click",()=>{if(usersBox.classList.contains("visible")){usersBox.classList.remove("visible");onlineList.setAttribute("aria-expanded","false");usersBox.setAttribute("aria-hidden","true")}});
setInterval(()=>{document.querySelectorAll("#messages .time[data-timestamp]").forEach(element=>{const timestamp=Number(element.dataset.timestamp);if(Number.isFinite(timestamp))element.textContent=formatRelativeTime(timestamp)})},20000);
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopTypingNow()}else if(isConnected&&userRef){syncMyPresence()}});
function showSystemMsg(text,temporary=true){const div=document.createElement("div");div.className="sys";div.textContent=text;messagesDiv.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight;if(temporary)setTimeout(()=>{div.classList.add("fade-out");setTimeout(()=>{if(div.parentNode)div.remove()},500)},4000)}
loadPendingMessages();username=getSavedUsername();saveUsername(username);showSystemMsg("مرحبًا "+username,true);const authenticated=await authenticate();if(!authenticated)return;initializeReferences();setupOnlineListeners();setupTypingListeners();setupMessageListeners();await setupPresence();startPresenceHeartbeat();setTimeout(()=>{showSystemMsg("💡 اضغط على اسمك في إحدى رسائلك لتغييره",true)},1200);if(pendingMessages.length>0)setTimeout(()=>{showSystemMsg("📦 لديك "+pendingMessages.length+" رسالة محفوظة",true)},1800);
});
</script>
