function isUserActive(data){const last=Number(data&&data.lastActive)||0;return last>0&&getServerNow()-last<=INACTIVE_AFTER}
function updateOnlineCount(){onlineCountEl.textContent=String(Object.values(onlineUsersCache).filter(isUserActive).length)}
function refreshOnlineUsers(){Object.entries(onlineUsersCache).forEach(([key,data])=>{const item=document.getElementById("user-"+key);if(!isUserActive(data)){if(item)item.remove()}else if(!item){const newItem=buildUserItem(key);applyUserItemData(newItem,key,data);usersList.appendChild(newItem)}});updateOnlineCount()}
function startPresenceHeartbeat(){if(presenceHeartbeatTimer)clearInterval(presenceHeartbeatTimer);presenceHeartbeatTimer=setInterval(()=>{if(!isConnected||!userRef)return;userRef.update({name:username,lastActive:firebase.database.ServerValue.TIMESTAMP}).then(()=>{onlineUsersCache[currentUser.uid]={...(onlineUsersCache[currentUser.uid]||{}),name:username,lastActive:getServerNow()};refreshOnlineUsers()}).catch(e=>console.warn("Presence heartbeat failed:",e))},PRESENCE_INTERVAL)}
function startPresenceSweep(){if(presenceSweepTimer)clearInterval(presenceSweepTimer);presenceSweepTimer=setInterval(refreshOnlineUsers,10000)}
function buildUserItem(key){const item=document.createElement("div");item.className="user-item";item.id="user-"+key;const dot=document.createElement("span");dot.className="status-indicator";const name=document.createElement("span");name.className="user-name";item.append(dot,name);return item}
function applyUserItemData(item,key,data){if(!item||!data)return;const name=item.querySelector(".user-name");if(name){name.textContent=(sanitizeUsername(data.name)||"مستخدم")+(key===currentUser.uid?" [أنت]":"");name.title=key===currentUser.uid?"أنت":"متصل"}}
function handleUserAdded(s){const key=s.key,data=s.val();if(!key||!data)return;onlineUsersCache[key]=data;const old=document.getElementById("user-"+key);if(old)old.remove();if(isUserActive(data)){const item=buildUserItem(key);applyUserItemData(item,key,data);usersList.appendChild(item)}updateOnlineCount()}
function handleUserChanged(s){const key=s.key,data=s.val();if(!key||!data)return;onlineUsersCache[key]=data;const item=document.getElementById("user-"+key);if(isUserActive(data)){const active=item||buildUserItem(key);applyUserItemData(active,key,data);if(!item)usersList.appendChild(active)}else if(item)item.remove();updateOnlineCount()}
function handleUserRemoved(s){delete onlineUsersCache[s.key];document.getElementById("user-"+s.key)?.remove();updateOnlineCount()}
function setupOnlineListeners(){onlineRef.on("child_added",handleUserAdded);onlineRef.on("child_changed",handleUserChanged);onlineRef.on("child_removed",handleUserRemoved);startPresenceSweep()}
function renderTypingIndicator(){const names=Object.entries(typingUsersCache).filter(([uid,data])=>uid!==currentUser.uid&&data&&typeof data.name==="string").map(([,data])=>sanitizeUsername(data.name)).filter(Boolean);if(!names.length){typingIndicatorEl.classList.remove("visible");typingIndicatorEl.textContent="";return}typingIndicatorEl.textContent=names.length===1?names[0]+" يكتب الآن...":names.length===2?names[0]+" و "+names[1]+" يكتبان الآن...":"عدة أشخاص يكتبون الآن...";typingIndicatorEl.classList.add("visible")}
function setTyping(){if(!isConnected||!myTypingRef)return;clearTimeout(typingTimer);myTypingRef.set({name:username,ts:firebase.database.ServerValue.TIMESTAMP}).catch(e=>console.warn("Typing update failed:",e));typingTimer=setTimeout(stopTypingNow,TYPING_TIMEOUT)}
function stopTypingNow(){clearTimeout(typingTimer);if(!isConnected||!myTypingRef)return;myTypingRef.remove().catch(()=>{})}
function setupTypingListeners(){typingRef.on("child_added",s=>{if(s.key!==currentUser.uid){typingUsersCache[s.key]=s.val();renderTypingIndicator()}});typingRef.on("child_changed",s=>{if(s.key!==currentUser.uid){typingUsersCache[s.key]=s.val();renderTypingIndicator()}});typingRef.on("child_removed",s=>{delete typingUsersCache[s.key];renderTypingIndicator()});setInterval(()=>{let changed=false;const now=getServerNow();Object.keys(typingUsersCache).forEach(uid=>{const ts=Number(typingUsersCache[uid]?.ts);if(ts&&now-ts>TYPING_STALE_TIME){delete typingUsersCache[uid];changed=true}});if(changed)renderTypingIndicator()},10000)}
async function changeUsername(newName){newName=sanitizeUsername(newName);if(!newName){showSystemMsg("⚠️ الاسم لا يمكن أن يكون فارغًا",true);return}if(newName===username)return;if(!isConnected){showSystemMsg("⚠️ يجب الاتصال بالإنترنت لتغيير الاسم",true);return}const old=username;username=newName;saveUsername(username);try{await userRef.update({name:username,lastActive:firebase.database.ServerValue.TIMESTAMP});onlineUsersCache[currentUser.uid]={...(onlineUsersCache[currentUser.uid]||{}),name:username,lastActive:getServerNow()};showSystemMsg("✅ "+old+" → "+username,true);updateDisplayedOwnNames(old,username)}catch(e){username=old;saveUsername(username);showSystemMsg("❌ تعذر تغيير الاسم",true);console.error("Username update failed:",e)}}
function updateDisplayedOwnNames(oldName,newName){document.querySelectorAll(".msg.mine .user").forEach(el=>{if(el.textContent===oldName)el.textContent=newName})}
function isValidMessage(data){return!!data&&typeof data.text==="string"&&data.text.length>0&&data.text.length<=MAX_MESSAGE_LENGTH}
function addMessage(key,data){if(!key||renderedMessageIds.has(key)||!isValidMessage(data))return;renderedMessageIds.add(key);const div=document.createElement("div");div.className="msg";div.id="msg-"+key;const mine=data.userId===currentUser.uid;if(mine)div.classList.add("mine");const user=document.createElement("span");user.className="user";user.textContent=sanitizeUsername(data.user)||"مستخدم";if(mine){user.title="اضغط لتغيير اسمك";user.addEventListener("click",e=>{e.stopPropagation();const next=prompt("الاسم الجديد:",username);if(next!==null)changeUsername(next)})}const text=document.createElement("span");text.className="text";text.textContent=data.text;const stamp=Number(data.timestamp)||Date.now();const time=document.createElement("span");time.className="time";time.dataset.timestamp=String(stamp);time.textContent=formatRelativeTime(stamp)||data.time||"";time.title=new Date(stamp).toLocaleTimeString("ar");div.append(user,text,time);messagesDiv.appendChild(div);if(messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight<180)messagesDiv.scrollTop=messagesDiv.scrollHeight}
function setupMessageListeners(){messagesRef.limitToLast(MAX_VISIBLE_MESSAGES).on("child_added",s=>addMessage(s.key,s.val()));messagesRef.on("child_removed",s=>{document.getElementById("msg-"+s.key)?.remove();renderedMessageIds.delete(s.key)})}
async function sendMessage(){stopTypingNow();const now=Date.now();if(now-lastSendTime<SEND_COOLDOWN)return;const text=messageInput.value.trim();if(!text){showSystemMsg("⚠️ اكتب شيئًا",true);return}if(text.length>MAX_MESSAGE_LENGTH){showSystemMsg("⚠️ الرسالة طويلة جدًا",true);return}if(isSending)return;lastSendTime=now;if(!isConnected){queueOfflineMessage(text);messageInput.value="";return}isSending=true;sendBtn.disabled=true;try{await messagesRef.push().set({userId:currentUser.uid,user:username,text,timestamp:firebase.database.ServerValue.TIMESTAMP});messageInput.value=""}catch(e){console.error("Message send failed:",e);showSystemMsg("❌ تعذر إرسال الرسالة، تم حفظها للمحاولة لاحقًا",true);queueOfflineMessage(text)}finally{isSending=false;sendBtn.disabled=false}}
async function resendPendingMessages(){if(!isConnected||!messagesRef||!pendingMessages.length)return;const queue=[...pendingMessages];for(const item of queue){if(!isConnected)break;try{await messagesRef.push().set({userId:currentUser.uid,user:username,text:item.text,timestamp:firebase.database.ServerValue.TIMESTAMP});pendingMessages=pendingMessages.filter(x=>x.localId!==item.localId);savePendingMessages()}catch(e){console.warn("Pending message failed:",e);break}}}
function togglePopup(which){const target=which==="history"?historyBox:usersBox,other=which==="history"?usersBox:historyBox,button=which==="history"?historyBtn:onlineList,otherButton=which==="history"?onlineList:historyBtn;const open=!target.classList.contains("visible");target.classList.toggle("visible",open);target.setAttribute("aria-hidden",String(!open));button.setAttribute("aria-expanded",String(open));other.classList.remove("visible");other.setAttribute("aria-hidden","true");otherButton.setAttribute("aria-expanded","false")}
onlineList.addEventListener("click",e=>{e.stopPropagation();togglePopup("users")});
historyBtn.addEventListener("click",e=>{e.stopPropagation();togglePopup("history")});
usersBox.addEventListener("click",e=>e.stopPropagation());
historyBox.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>{for(const [box,button] of [[usersBox,onlineList],[historyBox,historyBtn]]){box.classList.remove("visible");box.setAttribute("aria-hidden","true");button.setAttribute("aria-expanded","false")}if(emojiPickerWrap.classList.contains("visible"))setEmojiPicker(false)});
inputAreaForm.addEventListener("submit",e=>{e.preventDefault();sendMessage()});
messageInput.addEventListener("input",()=>messageInput.value.trim()?setTyping():stopTypingNow());
messageInput.addEventListener("blur",stopTypingNow);
function setEmojiPicker(open){emojiPickerWrap.classList.toggle("visible",open);emojiPickerWrap.setAttribute("aria-hidden",String(!open));emojiBtn.setAttribute("aria-expanded",String(open));if(open)setTimeout(()=>emojiPicker?.focus?.(),0)}
emojiBtn.addEventListener("click",e=>{e.stopPropagation();setEmojiPicker(!emojiPickerWrap.classList.contains("visible"))});
emojiPickerWrap.addEventListener("click",e=>e.stopPropagation());
emojiPicker.addEventListener("emoji-click",event=>{const value=event?.detail?.unicode||"";if(!value)return;const start=messageInput.selectionStart??messageInput.value.length,end=messageInput.selectionEnd??messageInput.value.length,next=messageInput.value.slice(0,start)+value+messageInput.value.slice(end);if(next.length>MAX_MESSAGE_LENGTH)return;messageInput.value=next;messageInput.dispatchEvent(new Event("input",{bubbles:true}));messageInput.focus({preventScroll:true});try{messageInput.setSelectionRange(start+value.length,start+value.length)}catch(e){}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){setEmojiPicker(false);usersBox.classList.remove("visible");historyBox.classList.remove("visible")}});
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopTypingNow();else if(isConnected&&userRef)syncMyPresence()});
setInterval(()=>document.querySelectorAll("#messages .time[data-timestamp]").forEach(el=>{const t=Number(el.dataset.timestamp);if(Number.isFinite(t))el.textContent=formatRelativeTime(t)}),30000);
loadPendingMessages();username=getSavedUsername();saveUsername(username);showSystemMsg("مرحبًا "+username,true);
if(!await authenticate())return;
initializeReferences();
setupOnlineListeners();
setupTypingListeners();
setupMessageListeners();
setupHistory();
await setupPresence();
startPresenceHeartbeat();
showSystemMsg("💡 اضغط على اسمك في إحدى رسائلك لتغييره",true);
if(pendingMessages.length)showSystemMsg("📦 لديك "+pendingMessages.length+" رسالة محفوظة",true);
});
</script>
