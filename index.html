function renderLoginOnline(){var box=$("#lonline");if(!box)return;var rows=[];Object.keys(presenceCache).forEach(function(k){var u=presenceCache[k];if(!u)return;rows.push({uid:k,name:u.name||"مستخدم",icon:u.icon||"",avatar:avatarsCache[k]||u.avatar||"",ts:u.ts||0})});rows.sort(function(a,b){return(b.ts||0)-(a.ts||0)});box.innerHTML="";if(!rows.length){box.innerHTML="<div style='text-align:center;color:#888;padding:20px;font-size:13px'>لا يوجد متواجدون</div>";return}var f=document.createDocumentFragment();rows.forEach(function(r){var row=document.createElement("div");row.className="uhtml";var line=document.createElement("span");line.className="ustat";line.style.background=statusColor(r.ts);row.appendChild(line);var pic=document.createElement("div");pic.className="u-pic fitimg";pic.style.backgroundImage="url('"+r.avatar+"')";row.appendChild(pic);var di2=document.createElement("div");di2.className="di2";var row1=document.createElement("div");row1.className="row1";if(r.icon){var ic=document.createElement("img");ic.className="u-ico";ic.src=r.icon;row1.appendChild(ic)}var nm=document.createElement("span");nm.className="nm";nm.textContent=r.name;row1.appendChild(nm);di2.appendChild(row1);row.appendChild(di2);f.appendChild(row)});box.appendChild(f)}
function renderUsersPanel(filter){var list=$("#usersList");if(!list)return;var rows=[];Object.keys(presenceCache).forEach(function(k){var u=presenceCache[k];if(!u)return;rows.push({uid:k,name:u.name||"مستخدم",icon:u.icon||"",avatar:avatarsCache[k]||u.avatar||"",ts:u.ts||0})});rows.sort(function(a,b){if(a.uid===me.uid)return-1;if(b.uid===me.uid)return 1;return(b.ts||0)-(a.ts||0)});if(filter)rows=rows.filter(function(r){return(r.name||"").toLowerCase().indexOf(filter)!==-1});list.innerHTML="";if(!rows.length){list.innerHTML="<div class='users-empty'>لا يوجد متواجدون</div>";return}var f=document.createDocumentFragment();rows.forEach(function(r){var row=document.createElement("div");row.className="uhtml clickable";row.onclick=function(){openViewModal({name:r.name+(r.uid===me.uid?" (أنت)":"")},r.avatar)};var line=document.createElement("span");line.className="ustat";line.style.background=statusColor(r.ts);row.appendChild(line);var pic=document.createElement("div");pic.className="u-pic fitimg";pic.style.backgroundImage="url('"+r.avatar+"')";row.appendChild(pic);var di2=document.createElement("div");di2.className="di2";var row1=document.createElement("div");row1.className="row1";if(r.icon){var ic=document.createElement("img");ic.className="u-ico";ic.src=r.icon;row1.appendChild(ic)}var nm=document.createElement("span");nm.className="nm";nm.textContent=r.name+(r.uid===me.uid?" (أنت)":"");row1.appendChild(nm);di2.appendChild(row1);var row2=document.createElement("div");row2.className="mini";row2.style.cssText="font-size:13.68px!important;color:#888;padding:1px 2px;text-align:left";row2.textContent=statusText(r.ts);di2.appendChild(row2);row.appendChild(di2);f.appendChild(row)});list.appendChild(f)}
$("#btnEnter").onclick=function(){var n=$("#inName").value.trim();if(n.length<2){alert("اكتب اسم صحيح");return}me={uid:uid(),name:n,color:"#000099",icon:"",avatar:defAva(n)};localStorage.setItem("chat_me",JSON.stringify(me));$("#loginScreen").style.display="none";$("#site_main").classList.remove("hid");start()};
function start(){presenceRef=db.ref("rooms/"+ROOM+"/presence/"+me.uid);presenceRef.set({name:me.name,icon:me.icon,color:me.color,avatar:me.avatar,ts:Date.now()});presenceRef.onDisconnect().remove();var hb=setInterval(function(){if(me&&presenceRef)presenceRef.update({ts:Date.now()})},25000);document.addEventListener("mousemove",touchActivity,{passive:true});document.addEventListener("keydown",touchActivity,{passive:true});document.addEventListener("click",touchActivity,{passive:true});window.addEventListener("beforeunload",function(){clearInterval(hb);if(presenceRef)presenceRef.remove()});var mr=db.ref("rooms/"+ROOM+"/messages").limitToLast(200);unsub=function(){mr.off()};mr.on("value",function(s){lastMessages=[];s.forEach(function(c){lastMessages.push(Object.assign({id:c.key},c.val()))});lastMessages.sort(function(a,b){return(a.ts||0)-(b.ts||0)});renderAll()});setInterval(function(){document.querySelectorAll(".tago").forEach(function(el){el.textContent=ago(Number(el.dataset.ago))})},15000)}
function renderAll(){var box=$("#d2");if(!box)return;var f=document.createDocumentFragment();lastMessages.forEach(function(m){f.appendChild(renderMsg(m))});box.innerHTML="";box.appendChild(f);requestAnimationFrame(function(){box.scrollTop=box.scrollHeight})}
function renderMsg(m){var own=m.uid===me.uid;var av=avatarsCache[m.uid]||m.avatar||"";var w=document.createElement("div");w.className="uzr d-flex mm";var p=document.createElement("div");p.className="fitimg u-pic";p.style.backgroundImage="url('"+av+"')";p.onclick=function(){openViewModal(m,av)};var b=document.createElement("div");b.className="uzr flex-fill break uzr-body";var h=document.createElement("div");h.className="d-flex";var nw=document.createElement("div");nw.className="d-flex flex-grow-1";nw.style.overflow="hidden";if(m.icon){var ic=document.createElement("img");ic.className="u-ico";ic.src=m.icon;nw.appendChild(ic)}var nm=document.createElement("span");nm.className="nosel u-topic dots hand";nm.style.color=m.color||"#000099";nm.style.direction="rtl";nm.textContent=m.name;nm.onclick=function(){openViewModal(m,av)};nw.appendChild(nm);var tw=document.createElement("div");tw.style.cssText="display:flex;justify-content:flex-end;align-items:center";var tg=document.createElement("span");tg.className="minix tago";tg.dataset.ago=m.ts||Date.now();tg.textContent=ago(m.ts);tw.appendChild(tg);h.append(nw,tw);var msg=document.createElement("div");msg.className="u-msg break";msg.style.color=m.color||"#000099";msg.style.padding="2px 5px 3px";msg.textContent=m.text;if(own){var bd=document.createElement("button");bd.className="bdel corner minix";bd.title="حذف";bd.textContent="×";bd.onclick=function(e){e.stopPropagation();if(confirm("حذف؟"))db.ref("rooms/"+ROOM+"/messages/"+m.id).remove()};msg.appendChild(bd)}b.append(h,msg);w.append(p,b);return w}
function send(){var t=$("#tbox").value.trim();if(!t||!me)return;$("#tbox").value="";$("#tbox").focus();db.ref("rooms/"+ROOM+"/messages").push({uid:me.uid,name:me.name,color:me.color,icon:me.icon,avatar:me.avatar,text:t,ts:Date.now()}).catch(function(){toast("فشل الإرسال",true);$("#tbox").value=t})}
$("#btnSend").onclick=send;$("#tbox").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
$("#btnLeave").onclick=function(){if(!confirm("خروج؟"))return;if(me&&presenceRef)presenceRef.remove();if(unsub)unsub();localStorage.removeItem("chat_me");location.reload()};
function openUsersPanel(){$("#usersBackdrop").classList.add("show");$("#usersPanel").classList.add("show");renderUsersPanel()}

function openAvatarModal(){$("#avatarModal").style.display="flex";$("#avatarPreview").style.backgroundImage="url('"+(avatarsCache[me.uid]||me.avatar||"")+"')";$("#avatarFile").value="";$("#avatarUrl").value="";setAvatarStatus("","");$("#avatarSave").disabled=false;pendingAvatarData=null}

$("#avatarFile").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;if(!f.type||f.type.indexOf("image/")!==0){setAvatarStatus("الملف ليس صورة","error");return}if(f.size>10*1024*1024){setAvatarStatus("الصورة كبيرة","error");return}setAvatarStatus("جاري المعالجة...","info");$("#avatarUrl").value="";processImageFile(f,200,0.82).then(function(d){pendingAvatarData=d;$("#avatarPreview").style.backgroundImage="url('"+d+"')";setAvatarStatus("جاهزة ("+Math.round(d.length/1024)+"KB)","success")}).catch(function(err){setAvatarStatus("خطأ: "+err.message,"error");pendingAvatarData=null})});
var urlTimer=null;$("#avatarUrl").addEventListener("input",function(e){var u=e.target.value.trim();clearTimeout(urlTimer);if(!u){setAvatarStatus("","");return}pendingAvatarData=null;$("#avatarFile").value="";setAvatarStatus("جاري التحقق...","info");$("#avatarPreview").style.backgroundImage="url('"+u+"')";urlTimer=setTimeout(function(){verifyExternalImage(u).then(function(){setAvatarStatus("يعمل ✓","success")}).catch(function(err){setAvatarStatus("تحذير: "+err.message,"error")})},600)});
$("#avatarSave").onclick=async function(){var b=$("#avatarSave");var u=$("#avatarUrl").value.trim();var nu=null;if(pendingAvatarData)nu=pendingAvatarData;else if(u){if(!/^https?:\/\//i.test(u)){setAvatarStatus("الرابط غير صالح","error");return}nu=u}else{setAvatarStatus("اختر صورة","error");return}b.disabled=true;setAvatarStatus("جاري الحفظ...","info");try{await db.ref("rooms/"+ROOM+"/avatars/"+me.uid).set({url:nu,ts:Date.now()});me.avatar=nu;localStorage.setItem("chat_me",JSON.stringify(me));if(presenceRef)presenceRef.update({avatar:nu,ts:Date.now()});setAvatarStatus("تم ✓","success");toast("تم التحديث");setTimeout(closeAvatarModal,400)}catch(err){setAvatarStatus("فشل","error");b.disabled=false}};

document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("#usersPanel").classList.contains("show"))closeUsersPanel();if($("#viewModal").style.display==="flex")closeViewModal();if($("#avatarModal").style.display==="flex")closeAvatarModal()}});
