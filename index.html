<html lang="ar" dir="rtl">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
:root{--bg:#0a0a0a;--bg2:#050505;--green:#00ff41;--green2:#00cc33;--dark-green:#004400;--border:#003300;--red:#ff0044;--yellow:#ffaa00;--time:#88cc88}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;padding:0;background:var(--bg);color:var(--green);overflow:hidden}
body{font-family:"Share Tech Mono","Tajawal",monospace;position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none}
button,input{font:inherit}
button{-webkit-appearance:none;appearance:none}
#chat-container{display:flex;flex-direction:column;width:100%;height:100dvh;min-height:0;background:var(--bg)}
#messages{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px;background:var(--bg);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:var(--green) var(--bg)}
#messages::-webkit-scrollbar{width:6px}
#messages::-webkit-scrollbar-track{background:var(--bg)}
#messages::-webkit-scrollbar-thumb{background:var(--green);border:1px solid var(--dark-green)}
.msg{display:flex;align-items:baseline;gap:8px;width:100%;margin:2px 0;padding:2px 4px;direction:ltr;text-align:left;font-size:13px;line-height:1.5;color:var(--green);overflow-wrap:anywhere;word-break:break-word}
.msg .user{flex:0 0 auto;color:var(--green);font-weight:bold;cursor:default;direction:rtl;unicode-bidi:plaintext}
.msg.mine .user{cursor:pointer}
.msg.mine .user:hover{color:#fff;text-shadow:0 0 10px var(--green)}
.msg .text{flex:1 1 auto;min-width:0;color:var(--green2);direction:auto;unicode-bidi:plaintext;white-space:pre-wrap}
.msg .time{flex:0 0 auto;margin-left:auto;color:var(--time);font-size:10px;white-space:nowrap}
.sys{width:fit-content;max-width:95%;margin:5px auto;padding:3px 7px;border:1px solid var(--time);color:var(--time);background:transparent;font-size:11px;text-align:center;direction:rtl;overflow-wrap:anywhere;transition:opacity 0.5s ease;text-shadow:0 0 8px var(--time)}
.sys.fade-out{opacity:0}
#typingIndicator{flex-shrink:0;min-height:20px;padding:0 10px;line-height:20px;font-size:11px;font-style:italic;color:var(--time);background:var(--bg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;visibility:hidden;transition:opacity 0.15s ease}
#typingIndicator.visible{opacity:1;visibility:visible}
#inputArea{display:flex;flex-direction:row;align-items:center;gap:5px;flex-shrink:0;min-height:46px;padding:6px 8px;background:var(--bg2);border-bottom:1px solid var(--green);position:relative;z-index:10}
#messageInput{flex:1;min-width:0;width:100%;height:34px;padding:5px 8px;border:1px solid var(--green);border-radius:0;outline:none;background:var(--bg);color:var(--green);font-family:"Share Tech Mono","Tajawal",monospace;font-size:16px;line-height:22px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#messageInput:focus{border-color:#fff;background:var(--bg2);box-shadow:0 0 15px rgba(0,255,65,0.2)}
#messageInput::placeholder{color:var(--dark-green)}
#sendBtn{flex:0 0 auto;height:34px;padding:5px 13px;border:1px solid var(--green);border-radius:0;outline:none;background:var(--bg);color:var(--green);cursor:pointer;font-size:13px;font-weight:bold;touch-action:manipulation;transition:background 0.15s,color 0.15s}
#sendBtn:hover,#sendBtn:focus-visible{background:var(--green);color:var(--bg)}
#sendBtn:active{background:var(--dark-green);color:var(--green)}
#sendBtn:disabled{opacity:0.5;cursor:not-allowed}
#onlineList{position:fixed;top:5px;right:5px;z-index:1000;display:flex;align-items:center;gap:4px;padding:3px 10px;border:1px solid var(--green);background:var(--bg);color:var(--green);font-size:12px;cursor:pointer;user-select:none}
#onlineList:hover{background:var(--green);color:var(--bg);box-shadow:0 0 20px rgba(0,255,65,0.2)}
#usersBox{position:fixed;top:32px;right:5px;z-index:999;min-width:150px;max-width:220px;max-height:260px;padding:6px 10px;border:1px solid var(--green);background:var(--bg);color:var(--green);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 0.2s ease}
#usersBox.visible{opacity:1;visibility:visible;pointer-events:auto}
#usersBox h4{margin:0 0 5px;padding-bottom:3px;border-bottom:1px solid var(--dark-green);color:var(--green);font-size:13px}
#usersList{max-height:200px;overflow-y:auto}
.user-item{display:flex;align-items:center;gap:5px;padding:3px 2px;border-bottom:1px solid var(--border);font-size:12px}
.user-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--green);direction:rtl;unicode-bidi:plaintext}
.status-indicator{width:7px;height:7px;flex:0 0 7px;border-radius:50%;border:1px solid var(--green)}
.status-green{background:var(--green);box-shadow:0 0 8px var(--green)}
.status-yellow{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px var(--yellow)}
#connection-status{position:fixed;bottom:55px;left:50%;z-index:999;display:none;transform:translateX(-50%);padding:3px 15px;border:1px solid var(--time);background:var(--bg);font-family:"Share Tech Mono",monospace;font-size:11px;font-weight:bold;white-space:nowrap;text-shadow:0 0 8px var(--time)}
#connection-status.visible{display:block}
#connection-status.online{color:var(--time);border-color:var(--time)}
#connection-status.offline{color:var(--time);border-color:var(--time)}
#connection-status.reconnecting{color:var(--time);border-color:var(--time)}
@media(max-width:768px){#messages{padding:6px}.msg{gap:6px;font-size:13px}#inputArea{min-height:48px;padding:6px}#messageInput{height:36px;font-size:16px}#sendBtn{height:36px;padding:6px 12px;font-size:14px}#connection-status{bottom:58px}}
@media(max-width:360px){#onlineList{font-size:11px;padding:3px 7px}#sendBtn{padding-left:9px;padding-right:9px}}
</style>
</head>
<body>
<div id="chat-container">
<div id="onlineList" title="المتصلون الآن" role="button" tabindex="0" aria-expanded="false">
<i class="fa fa-users" aria-hidden="true"></i>
<span id="count">0</span>
<span>متصل</span>
</div>
<div id="usersBox" aria-hidden="true">
<h4>🖥️ المتصلون</h4>
<div id="usersList"></div>
</div>
<div id="messages" aria-live="polite" aria-label="الرسائل"></div>
<div id="connection-status"></div>
<div id="typingIndicator" aria-live="polite"></div>
<form id="inputArea">
<button type="submit" id="sendBtn">➤ إرسال</button>
<input type="text" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="true" maxlength="1000" aria-label="حقل إدخال الرسالة">
</form>
</div>
<script>
"use strict";
document.addEventListener("DOMContentLoaded",async()=>{
const firebaseConfig={apiKey:"AIzaSyB1AsEHXP05nQ8M66jYPusheLaE60q_JwU",authDomain:"mychat-2d881.firebaseapp.com",databaseURL:"https://mychat-2d881-default-rtdb.firebaseio.com"};
try{firebase.initializeApp(firebaseConfig)}catch(error){console.error("Firebase initialization error:",error);showFatalError("تعذر تشغيل Firebase");return}
const auth=firebase.auth();const db=firebase.database();
const MAX_MESSAGE_LENGTH=1000;const MAX_USERNAME_LENGTH=20;const MAX_VISIBLE_MESSAGES=50;const TYPING_TIMEOUT=2000;const TYPING_STALE_TIME=10000;const PRESENCE_INTERVAL=30000;const INACTIVE_AFTER=120000;const SEND_COOLDOWN=700;const OFFLINE_QUEUE_KEY="chat_pending_messages_v2";const USERNAME_KEY="chat_username_v2";
const onlineList=document.getElementById("onlineList");const usersBox=document.getElementById("usersBox");const usersList=document.getElementById("usersList");const onlineCountEl=document.getElementById("count");const messagesDiv=document.getElementById("messages");const connectionStatus=document.getElementById("connection-status");const typingIndicatorEl=document.getElementById("typingIndicator");const messageInput=document.getElementById("messageInput");const inputAreaForm=document.getElementById("inputArea");const sendBtn=document.getElementById("sendBtn");
let currentUser=null;let username="";let userRef=null;let messagesRef=null;let onlineRef=null;let typingRef=null;let myTypingRef=null;let isConnected=false;let isSending=false;let typingTimer=null;let serverTimeOffset=0;let lastSendTime=0;
const onlineUsersCache=Object.create(null);const typingUsersCache=Object.create(null);const renderedMessageIds=new Set();let pendingMessages=[];
function showFatalError(message){document.body.innerHTML="";const box=document.createElement("div");box.style.cssText="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#0a0a0a;color:#ff0044;font-family:monospace;text-align:center;direction:rtl";box.textContent=message;document.body.appendChild(box)}
function sanitizeUsername(value){return String(value||"").replace(/[\u0000-\u001F\u007F]/g,"").trim().slice(0,MAX_USERNAME_LENGTH)}
function generateUsername(){return "زائر"+Math.floor(1000+Math.random()*9000)}
function getSavedUsername(){try{const saved=localStorage.getItem(USERNAME_KEY);const clean=sanitizeUsername(saved);if(clean){return clean}}catch(error){console.warn("localStorage read failed:",error)}return generateUsername()}
function saveUsername(value){try{localStorage.setItem(USERNAME_KEY,value)}catch(error){console.warn("localStorage write failed:",error)}}
function getServerNow(){return Date.now()+serverTimeOffset}
const TIME_FORMS={seconds:{one:"ثانية",two:"ثانيتين",few:"ثوانٍ",many:"ثانية"},minutes:{one:"دقيقة",two:"دقيقتين",few:"دقائق",many:"دقيقة"},hours:{one:"ساعة",two:"ساعتين",few:"ساعات",many:"ساعة"},days:{one:"يوم",two:"يومين",few:"أيام",many:"يوم"}};
function formatUnit(number,forms){if(number===1){return forms.one}if(number===2){return forms.two}if(number>=3&&number<=10){return number+" "+forms.few}return number+" "+forms.many}
function formatRelativeTime(timestampMs){if(!timestampMs||!Number.isFinite(Number(timestampMs))){return""}const now=getServerNow();let diffSeconds=Math.floor((now-Number(timestampMs))/1000);if(diffSeconds<0){diffSeconds=0}if(diffSeconds<5){return"الآن"}if(diffSeconds<60){return formatUnit(diffSeconds,TIME_FORMS.seconds)}const minutes=Math.floor(diffSeconds/60);if(minutes<60){return formatUnit(minutes,TIME_FORMS.minutes)}const hours=Math.floor(minutes/60);if(hours<24){return formatUnit(hours,TIME_FORMS.hours)}const days=Math.floor(hours/24);return formatUnit(days,TIME_FORMS.days)}
let statusTimer=null;
function showConnectionStatus(status,type){connectionStatus.textContent=status;connectionStatus.className="visible "+type;clearTimeout(statusTimer);if(type==="online"){statusTimer=setTimeout(()=>{connectionStatus.className=""},2500)}}
function loadPendingMessages(){try{const saved=localStorage.getItem(OFFLINE_QUEUE_KEY);if(!saved){pendingMessages=[];return}const parsed=JSON.parse(saved);if(!Array.isArray(parsed)){pendingMessages=[];return}pendingMessages=parsed.filter(item=>{return item&&typeof item.text==="string"&&item.text.length>0&&item.text.length<=MAX_MESSAGE_LENGTH&&typeof item.localId==="string"})}catch(error){console.warn("Offline queue error:",error);pendingMessages=[]}}
function savePendingMessages(){try{localStorage.setItem(OFFLINE_QUEUE_KEY,JSON.stringify(pendingMessages))}catch(error){console.warn("Could not save offline messages:",error)}}
function queueOfflineMessage(text){const item={localId:"local_"+Date.now()+"_"+Math.random().toString(36).slice(2,10),text:text,createdAt:Date.now()};pendingMessages.push(item);if(pendingMessages.length>100){pendingMessages=pendingMessages.slice(-100)}savePendingMessages();showSystemMsg("💾 حفظت الرسالة ("+pendingMessages.length+")",true)}
async function authenticate(){try{if(auth.currentUser){currentUser=auth.currentUser}else{const result=await auth.signInAnonymously();currentUser=result.user}if(!currentUser||!currentUser.uid){throw new Error("Authentication returned no user")}return true}catch(error){console.error("Authentication failed:",error);showFatalError("تعذر تسجيل الدخول إلى النظام.\n\nتأكد من تفعيل Anonymous Authentication في Firebase.");return false}}
function initializeReferences(){const uid=currentUser.uid;userRef=db.ref("online/"+uid);messagesRef=db.ref("messages");onlineRef=db.ref("online");typingRef=db.ref("typing");myTypingRef=db.ref("typing/"+uid)}
async function setupPresence(){const uid=currentUser.uid;const connectedRef=db.ref(".info/connected");connectedRef.on("value",async snapshot=>{const connected=snapshot.val()===true;isConnected=connected;if(!connected){showConnectionStatus("⚠️ انقطع الاتصال، جاري إعادة الاتصال...","offline");return}showConnectionStatus("✅ متصل","online");try{await userRef.onDisconnect().remove();await myTypingRef.onDisconnect().remove();await userRef.set({name:username,joinedAt:firebase.database.ServerValue.TIMESTAMP,lastActive:firebase.database.ServerValue.TIMESTAMP});await resendPendingMessages()}catch(error){console.error("Presence error:",error);showConnectionStatus("⚠️ خطأ في الاتصال","reconnecting")}});db.ref(".info/serverTimeOffset").on("value",snapshot=>{serverTimeOffset=Number(snapshot.val())||0})}
setInterval(()=>{if(!isConnected||!userRef){return}userRef.update({lastActive:firebase.database.ServerValue.TIMESTAMP}).catch(error=>{console.warn("Presence heartbeat failed:",error)})},PRESENCE_INTERVAL);
function updateOnlineCount(){onlineCountEl.textContent=String(Object.keys(onlineUsersCache).length)}
function buildUserItem(userKey){const item=document.createElement("div");item.className="user-item";item.id="user-"+userKey;const indicator=document.createElement("span");indicator.className="status-indicator";const name=document.createElement("span");name.className="user-name";item.appendChild(indicator);item.appendChild(name);return item}
function applyUserItemData(item,userKey,userData){if(!item||!userData){return}const isMe=userKey===currentUser.uid;const displayName=sanitizeUsername(userData.name)||"مستخدم";const lastActive=Number(userData.lastActive)||0;const inactive=lastActive>0&&getServerNow()-lastActive>INACTIVE_AFTER;const indicator=item.querySelector(".status-indicator");const name=item.querySelector(".user-name");if(indicator){indicator.classList.remove("status-green","status-yellow");indicator.classList.add(inactive?"status-yellow":"status-green")}if(name){name.textContent=isMe?displayName+" [أنت]":displayName;name.title=isMe?"أنت":inactive?"آخر نشاط منذ أكثر من دقيقتين":"متصل"}}
function handleUserAdded(snapshot){const key=snapshot.key;const data=snapshot.val();if(!key||!data){return}onlineUsersCache[key]=data;const oldItem=document.getElementById("user-"+key);if(oldItem){oldItem.remove()}const item=buildUserItem(key);applyUserItemData(item,key,data);usersList.appendChild(item);updateOnlineCount()}
function handleUserChanged(snapshot){const key=snapshot.key;const data=snapshot.val();if(!key||!data){return}onlineUsersCache[key]=data;let item=document.getElementById("user-"+key);if(!item){item=buildUserItem(key);usersList.appendChild(item)}applyUserItemData(item,key,data)}
function handleUserRemoved(snapshot){const key=snapshot.key;delete onlineUsersCache[key];const item=document.getElementById("user-"+key);if(item){item.remove()}updateOnlineCount()}
function setupOnlineListeners(){onlineRef.on("child_added",handleUserAdded);onlineRef.on("child_changed",handleUserChanged);onlineRef.on("child_removed",handleUserRemoved)}
function renderTypingIndicator(){const names=Object.entries(typingUsersCache).filter(([uid,data])=>{return uid!==currentUser.uid&&data&&typeof data.name==="string"&&data.name.trim()}).map(([,data])=>sanitizeUsername(data.name)).filter(Boolean);if(names.length===0){typingIndicatorEl.classList.remove("visible");typingIndicatorEl.textContent="";return}let text;if(names.length===1){text=names[0]+" يكتب الآن..."}else if(names.length===2){text=names[0]+" و "+names[1]+" يكتبان الآن..."}else{text="عدة أشخاص يكتبون الآن..."}typingIndicatorEl.textContent=text;typingIndicatorEl.classList.add("visible")}
function setTyping(){if(!isConnected||!myTypingRef){return}clearTimeout(typingTimer);if(!typingIndicatorEl){return}myTypingRef.set({name:username,ts:firebase.database.ServerValue.TIMESTAMP}).catch(error=>{console.warn("Typing update failed:",error)});typingTimer=setTimeout(stopTypingNow,TYPING_TIMEOUT)}
function stopTypingNow(){clearTimeout(typingTimer);if(!isConnected||!myTypingRef){return}myTypingRef.remove().catch(error=>{console.warn("Typing removal failed:",error)})}
function setupTypingListeners(){typingRef.on("child_added",snapshot=>{if(snapshot.key===currentUser.uid){return}typingUsersCache[snapshot.key]=snapshot.val();renderTypingIndicator()});typingRef.on("child_changed",snapshot=>{if(snapshot.key===currentUser.uid){return}typingUsersCache[snapshot.key]=snapshot.val();renderTypingIndicator()});typingRef.on("child_removed",snapshot=>{delete typingUsersCache[snapshot.key];renderTypingIndicator()})}
setInterval(()=>{const now=getServerNow();let changed=false;Object.keys(typingUsersCache).forEach(uid=>{const data=typingUsersCache[uid];const ts=Number(data&&data.ts);if(ts&&now-ts>TYPING_STALE_TIME){delete typingUsersCache[uid];changed=true}});if(changed){renderTypingIndicator()}},5000);
async function changeUsername(newName){newName=sanitizeUsername(newName);if(!newName){showSystemMsg("⚠️ الاسم لا يمكن أن يكون فارغًا",true);return}if(newName.length>MAX_USERNAME_LENGTH){showSystemMsg("⚠️ الاسم طويل جدًا (الحد "+MAX_USERNAME_LENGTH+" حرف)",true);return}if(newName===username){return}if(!isConnected){showSystemMsg("⚠️ يجب الاتصال بالإنترنت لتغيير الاسم",true);return}const oldName=username;username=newName;saveUsername(username);try{await userRef.update({name:username,lastActive:firebase.database.ServerValue.TIMESTAMP});showSystemMsg("✅ "+oldName+" → "+username,true);updateDisplayedOwnNames(oldName,username)}catch(error){username=oldName;saveUsername(username);showSystemMsg("❌ تعذر تغيير الاسم",true);console.error("Username update failed:",error)}}
function updateDisplayedOwnNames(oldName,newName){document.querySelectorAll(".msg.mine .user").forEach(element=>{const text=element.textContent;if(text===oldName){element.textContent=newName}})}
function isValidMessage(data){if(!data||typeof data!=="object"){return false}if(typeof data.text!=="string"||data.text.length===0||data.text.length>MAX_MESSAGE_LENGTH){return false}return true}
function addMessage(key,data){if(!key||renderedMessageIds.has(key)||!isValidMessage(data)){return}renderedMessageIds.add(key);const div=document.createElement("div");div.className="msg";div.id="msg-"+key;const msgUserId=typeof data.userId==="string"?data.userId:"";const isMine=msgUserId===currentUser.uid;if(isMine){div.classList.add("mine")}const userSpan=document.createElement("span");userSpan.className="user";userSpan.textContent=sanitizeUsername(data.user)||"مستخدم";if(isMine){userSpan.title="اضغط لتغيير اسمك";userSpan.addEventListener("click",event=>{event.stopPropagation();const newName=window.prompt("الاسم الجديد:",username);if(newName!==null){changeUsername(newName)}})}const textSpan=document.createElement("span");textSpan.className="text";textSpan.textContent=data.text;const timestamp=Number(data.timestamp)||Date.now();const timeSpan=document.createElement("span");timeSpan.className="time";timeSpan.dataset.timestamp=String(timestamp);timeSpan.textContent=formatRelativeTime(timestamp)||data.time||"";timeSpan.title=data.time||new Date(timestamp).toLocaleTimeString();div.appendChild(userSpan);div.appendChild(textSpan);div.appendChild(timeSpan);messagesDiv.appendChild(div);const distanceFromBottom=messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight;if(distanceFromBottom<180){messagesDiv.scrollTop=messagesDiv.scrollHeight}}
function setupMessageListeners(){messagesRef.limitToLast(MAX_VISIBLE_MESSAGES).on("child_added",snapshot=>{addMessage(snapshot.key,snapshot.val())});messagesRef.on("child_removed",snapshot=>{const element=document.getElementById("msg-"+snapshot.key);if(element){element.remove()}renderedMessageIds.delete(snapshot.key)})}
async function sendMessage(){stopTypingNow();const now=Date.now();if(now-lastSendTime<SEND_COOLDOWN){return}const text=messageInput.value.trim();if(!text){showSystemMsg("⚠️ اكتب شيئًا",true);return}if(text.length>MAX_MESSAGE_LENGTH){showSystemMsg("⚠️ الرسالة طويلة جدًا",true);return}lastSendTime=now;if(!isConnected){queueOfflineMessage(text);messageInput.value="";return}if(isSending){return}isSending=true;sendBtn.disabled=true;try{const newMessageRef=messagesRef.push();await newMessageRef.set({userId:currentUser.uid,user:username,text:text,timestamp:firebase.database.ServerValue.TIMESTAMP});messageInput.value=""}catch(error){console.error("Message send failed:",error);showSystemMsg("❌ تعذر إرسال الرسالة، تم حفظها للمحاولة لاحقًا",true);queueOfflineMessage(text)}finally{isSending=false;sendBtn.disabled=false}}
async function resendPendingMessages(){if(!isConnected||!messagesRef||pendingMessages.length===0){return}const queue=[...pendingMessages];showSystemMsg("📤 محاولة إرسال "+queue.length+" رسالة محفوظة...",true);for(const item of queue){if(!isConnected){break}try{const ref=messagesRef.push();await ref.set({userId:currentUser.uid,user:username,text:item.text,timestamp:firebase.database.ServerValue.TIMESTAMP});pendingMessages=pendingMessages.filter(msg=>msg.localId!==item.localId);savePendingMessages()}catch(error){console.warn("Pending message failed:",error);break}}if(pendingMessages.length===0){showSystemMsg("✅ تم إرسال الرسائل المحفوظة",true)}else{showSystemMsg("📦 بقيت "+pendingMessages.length+" رسالة محفوظة",true)}}
inputAreaForm.addEventListener("submit",event=>{event.preventDefault();sendMessage()});
messageInput.addEventListener("input",()=>{if(messageInput.value.trim()){setTyping()}else{stopTypingNow()}});
messageInput.addEventListener("blur",stopTypingNow);
function toggleUsersBox(){const visible=usersBox.classList.toggle("visible");onlineList.setAttribute("aria-expanded",String(visible));usersBox.setAttribute("aria-hidden",String(!visible))}
onlineList.addEventListener("click",event=>{event.stopPropagation();toggleUsersBox()});
onlineList.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();toggleUsersBox()}});
usersBox.addEventListener("click",event=>{event.stopPropagation()});
document.addEventListener("click",()=>{if(usersBox.classList.contains("visible")){usersBox.classList.remove("visible");onlineList.setAttribute("aria-expanded","false");usersBox.setAttribute("aria-hidden","true")}});
setInterval(()=>{document.querySelectorAll("#messages .time[data-timestamp]").forEach(element=>{const timestamp=Number(element.dataset.timestamp);if(Number.isFinite(timestamp)){element.textContent=formatRelativeTime(timestamp)}})},20000);
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopTypingNow()}else if(isConnected&&userRef){userRef.update({lastActive:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{})}});
function showSystemMsg(text,temporary=true){const div=document.createElement("div");div.className="sys";div.textContent=text;messagesDiv.appendChild(div);messagesDiv.scrollTop=messagesDiv.scrollHeight;if(temporary){setTimeout(()=>{div.classList.add("fade-out");setTimeout(()=>{if(div.parentNode){div.remove()}},500)},4000)}}
loadPendingMessages();username=getSavedUsername();saveUsername(username);showSystemMsg("مرحبًا "+username,true);const authenticated=await authenticate();if(!authenticated){return}initializeReferences();setupOnlineListeners();setupTypingListeners();setupMessageListeners();await setupPresence();setTimeout(()=>{showSystemMsg("💡 اضغط على اسمك في إحدى رسائلك لتغييره",true)},1200);if(pendingMessages.length>0){setTimeout(()=>{showSystemMsg("📦 لديك "+pendingMessages.length+" رسالة محفوظة",true)},1800)}
