<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>شات خاص</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  
  <!-- Firebase مكتبات -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    /* ===== استايل هكر ===== */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0a0a0a;
    }
    
    body {
      font-family: 'Share Tech Mono', 'Tajawal', monospace;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      position: relative;
      color: #00ff41;
      /* منع حركة الصفحة */
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }
    
    #chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0a0a0a;
    }
    
    /* ===== منطقة الرسائل ===== */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: #0a0a0a;
      -webkit-overflow-scrolling: touch;
    }
    
    .msg {
      margin: 2px 0;
      padding: 2px 4px;
      display: flex;
      gap: 8px;
      align-items: center;
      direction: ltr;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      background: transparent;
      border: none;
      color: #00ff41;
    }
    
    .msg .user {
      color: #00ff41;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }
    
    .msg .user:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ff41;
    }
    
    .msg .time {
      font-size: 10px;
      color: #004400;
      margin-right: auto;
    }
    
    .msg .text {
      color: #00cc33;
    }
    
    /* ===== رسائل النظام ===== */
    .sys {
      text-align: center;
      color: #004400;
      font-size: 11px;
      margin: 4px auto;
      font-style: italic;
      background: transparent;
      padding: 2px 5px;
      border: none;
      transition: opacity 0.5s ease;
      opacity: 1;
      border: 1px solid #003300;
      border-radius: 0;
    }
    
    .sys.fade-out {
      opacity: 0;
    }
    
    /* ===== منطقة الإدخال - مع إصلاح التكبير ===== */
    #inputArea {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #050505;
      border-top: 1px solid #00ff41;
      border-bottom: 1px solid #00ff41;
      flex-shrink: 0;
      min-height: 40px;
      /* منع التغيير عند فتح لوحة المفاتيح */
      position: relative;
      z-index: 10;
    }
    
    #messageInput {
      flex: 1;
      font-size: 16px !important; /* 16px يمنع التكبير التلقائي في iOS */
      padding: 4px 8px;
      border: 1px solid #00ff41;
      border-radius: 0;
      font-family: 'Share Tech Mono', 'Tajawal', monospace;
      background: #0a0a0a;
      color: #00ff41;
      height: 28px;
      max-height: 50px;
      touch-action: manipulation;
      transition: none;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      outline: none;
    }
    
    #messageInput:focus {
      border-color: #ffffff;
      background: #050505;
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
    }
    
    #messageInput::placeholder {
      color: #004400;
    }
    
    #sendBtn {
      padding: 4px 12px;
      border: 1px solid #00ff41;
      border-radius: 0;
      background: #0a0a0a;
      color: #00ff41;
      cursor: pointer;
      font-family: 'Share Tech Mono', 'Tajawal', monospace;
      font-size: 13px;
      font-weight: bold;
      height: 28px;
      transition: all 0.3s;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    
    #sendBtn:hover {
      background: #00ff41;
      color: #0a0a0a;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
    }
    
    #sendBtn:active {
      background: #004400;
      color: #00ff41;
    }
    
    /* ===== قائمة المتصلين ===== */
    #onlineList {
      position: fixed;
      top: 5px;
      right: 5px;
      border: 1px solid #00ff41;
      background: #0a0a0a;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #00ff41;
      transition: all 0.3s;
    }
    
    #onlineList:hover {
      background: #00ff41;
      color: #0a0a0a;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }
    
    #onlineList .fa {
      color: #00ff41;
    }
    
    #onlineList:hover .fa {
      color: #0a0a0a;
    }
    
    #usersBox {
      position: fixed;
      top: 32px;
      right: 5px;
      background: #0a0a0a;
      border: 1px solid #00ff41;
      padding: 6px 10px;
      z-index: 999;
      min-width: 140px;
      max-width: 200px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      color: #00ff41;
    }
    
    #usersBox.visible {
      opacity: 1;
      visibility: visible;
    }
    
    #usersBox h4 {
      margin: 0 0 5px 0;
      color: #00ff41;
      font-size: 13px;
      border-bottom: 1px solid #004400;
      padding-bottom: 3px;
    }
    
    #usersList {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .user-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 2px 2px;
      border-bottom: 1px solid #003300;
      font-size: 12px;
      cursor: default;
    }
    
    .user-item .user-name {
      cursor: pointer;
      color: #00ff41;
    }
    
    .user-item .user-name:hover {
      color: #ffffff;
      text-shadow: 0 0 10px #00ff41;
    }
    
    .status-indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid #00ff41;
    }
    
    .status-green {
      background-color: #00ff41;
      box-shadow: 0 0 10px #00ff41;
    }
    
    .status-yellow {
      background-color: #ffaa00;
      box-shadow: 0 0 10px #ffaa00;
    }
    
    /* ===== حالة الاتصال ===== */
    #connection-status {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 15px;
      font-size: 11px;
      font-weight: bold;
      z-index: 999;
      display: none;
      border: 1px solid #00ff41;
      background: #0a0a0a;
      font-family: 'Share Tech Mono', monospace;
    }
    
    #connection-status.visible {
      display: block;
    }
    
    #connection-status.online {
      color: #00ff41;
      border-color: #00ff41;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
    }
    
    #connection-status.offline {
      color: #ff0044;
      border-color: #ff0044;
      box-shadow: 0 0 20px rgba(255, 0, 68, 0.2);
    }
    
    #connection-status.reconnecting {
      color: #ffaa00;
      border-color: #ffaa00;
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.2);
    }
    
    /* ===== تمرير ===== */
    #messages::-webkit-scrollbar {
      width: 6px;
    }
    
    #messages::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    
    #messages::-webkit-scrollbar-thumb {
      background: #00ff41;
      border: 1px solid #004400;
    }
    
    #messages::-webkit-scrollbar-thumb:hover {
      background: #ffffff;
    }
    
    /* ===== إصلاح التكبير - منع تكبير الصفحة ===== */
    * {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    
    /* منع التحديد التلقائي */
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
    
    /* تحسين اللمس على الهواتف */
    @media (max-width: 768px) {
      #messageInput {
        font-size: 16px !important;
        height: 32px;
        padding: 6px 8px;
      }
      
      #sendBtn {
        height: 32px;
        padding: 6px 14px;
        font-size: 14px;
      }
      
      #inputArea {
        padding: 6px 8px;
        min-height: 44px;
      }
    }
  </style>
</head>
<body>
  <!-- واجهة الدردشة -->
  <div id="chat-container">
    <div id="onlineList" title="المتصلون الآن">
      <i class="fa fa-users"></i>
      <span id="count">0</span>
      <span>متصل</span>
    </div>
    <div id="usersBox"><h4>🖥️ المتصلين</h4><div id="usersList"></div></div>
    <div id="messages"></div>
    <div id="connection-status"></div>
    <form id="inputArea" action="javascript:void(0);">
      <button type="submit" id="sendBtn">➤ إرسال</button>
      <input type="text" id="messageInput" placeholder="اكتب رسالتك..." autocomplete="off" aria-label="حقل إدخال الرسالة"/>
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const firebaseConfig = {
        apiKey: "AIzaSyB1AsEHXP05nQ8M66jYPusheLaE60q_JwU",
        authDomain: "mychat-2d881.firebaseapp.com",
        databaseURL: "https://mychat-2d881-default-rtdb.firebaseio.com",
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // ===== ID فريد للمستخدم =====
      let userId = localStorage.getItem('chat_userId');
      if (!userId) {
        userId = 'uid_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_userId', userId);
      }

      // ===== الاسم مع حفظ =====
      let username = localStorage.getItem('chat_username');
      if (!username) {
        username = "هكر_" + Math.floor(Math.random() * 9999);
        localStorage.setItem('chat_username', username);
      }

      // ===== عناصر الواجهة =====
      const onlineList = document.getElementById("onlineList");
      const usersBox = document.getElementById("usersBox");
      const usersList = document.getElementById("usersList");
      const count = document.getElementById("count");
      const messagesDiv = document.getElementById("messages");
      const connectionStatus = document.getElementById("connection-status");
      
      const userRef = db.ref("online/" + userId);
      const messagesRef = db.ref("messages");
      const onlineRef = db.ref("online");
      const messageInput = document.getElementById("messageInput");
      const inputAreaForm = document.getElementById("inputArea");
      
      let typingTimer, serverTimeOffset = 0;
      let isConnected = false;
      let reconnectAttempts = 0;
      const MAX_RECONNECT_ATTEMPTS = 10;
      
      // ===== مصفوفة حفظ الرسائل =====
      let pendingMessages = [];

      // ===== تحميل الرسائل المحفوظة =====
      function loadPendingMessages() {
        const saved = localStorage.getItem('pendingMessages');
        if (saved) {
          try {
            pendingMessages = JSON.parse(saved);
            if (pendingMessages.length > 0) {
              showSystemMsg(`📦 يوجد ${pendingMessages.length} رسالة محفوظة`, true);
            }
          } catch (e) {
            pendingMessages = [];
          }
        }
      }
      loadPendingMessages();

      // ===== عرض حالة الاتصال =====
      function showConnectionStatus(status, type) {
        connectionStatus.textContent = status;
        connectionStatus.className = 'visible ' + type;
        
        if (type === 'online') {
          setTimeout(() => {
            connectionStatus.className = '';
          }, 2000);
        }
      }

      // ===== إعادة الاتصال =====
      function attemptReconnect() {
        if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
          showConnectionStatus('❌ فشل الاتصال، حاول تحديث الصفحة', 'offline');
          return;
        }
        
        reconnectAttempts++;
        showConnectionStatus(`🔄 محاولة ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS}...`, 'reconnecting');
        
        setTimeout(() => {
          userRef.update({ 
            lastActive: firebase.database.ServerValue.TIMESTAMP,
            isTyping: false,
            name: username,
            userId: userId
          }).then(() => {
            userRef.onDisconnect().remove();
            showConnectionStatus('✅ متصل', 'online');
            reconnectAttempts = 0;
          }).catch(() => {
            attemptReconnect();
          });
        }, 3000 * reconnectAttempts);
      }

      // ===== مراقبة الاتصال =====
      const connectedRef = firebase.database().ref(".info/connected");
      connectedRef.on("value", (snap) => {
        const connected = snap.val();
        
        if (connected) {
          isConnected = true;
          reconnectAttempts = 0;
          showConnectionStatus('✅ متصل', 'online');
          
          userRef.set({ 
            lastActive: firebase.database.ServerValue.TIMESTAMP,
            isTyping: false,
            name: username,
            userId: userId,
            joinedAt: firebase.database.ServerValue.TIMESTAMP
          });
          userRef.onDisconnect().remove();
          
          // ===== إعادة إرسال الرسائل المحفوظة =====
          resendPendingMessages();
          
        } else {
          isConnected = false;
          showConnectionStatus('⚠️ انقطع الاتصال، جاري إعادة المحاولة...', 'offline');
          attemptReconnect();
        }
      });

      // ===== وقت السيرفر =====
      db.ref('.info/serverTimeOffset').on('value', snap => { 
        serverTimeOffset = snap.val() || 0; 
      });
      
      // ===== تحديث النشاط =====
      setInterval(() => { 
        if (isConnected) {
          userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP }); 
        }
      }, 30000);
      
      // ===== تنظيف المستخدمين =====
      setInterval(() => {
        if (!isConnected) return;
        const now = Date.now() + serverTimeOffset; 
        const STALE_THRESHOLD = 90 * 1000;
        onlineRef.once('value', snapshot => {
          const users = snapshot.val(); 
          if (!users) return;
          Object.keys(users).forEach(u => { 
            if (now - (users[u].lastActive || 0) > STALE_THRESHOLD) {
              db.ref('online/' + u).remove(); 
            }
          });
        });
      }, 60000);

      // ===== قائمة المتصلين =====
      onlineList.onclick = e => { 
        e.stopPropagation(); 
        usersBox.classList.toggle('visible'); 
      };
      
      document.onclick = () => { 
        if (usersBox.classList.contains('visible')) {
          usersBox.classList.remove('visible'); 
        }
      };
      
      usersBox.onclick = e => e.stopPropagation();

      // ===== مستخدمين =====
      onlineRef.on("value", snap => {
        const onlineUsers = snap.val() || {};
        count.textContent = snap.numChildren();
        renderUsersList(onlineUsers);
      });

      onlineRef.on("child_added", snap => { 
        if (snap.key !== userId) {
          const userData = snap.val();
          showSystemMsg(`🟢 ${userData.name || snap.key} دخل`, true);
        }
      });
      
      onlineRef.on("child_removed", snap => { 
        const userData = snap.val();
        showSystemMsg(`🔴 ${userData.name || snap.key} غادر`, true);
      });

      // ===== تغيير الاسم =====
      function changeUsername(newName) {
        newName = newName.trim();
        if (!newName) {
          showSystemMsg('⚠️ الاسم لا يمكن أن يكون فارغاً', true);
          return false;
        }
        
        if (newName.length > 20) {
          showSystemMsg('⚠️ الاسم طويل جداً (حد أقصى 20 حرف)', true);
          return false;
        }
        
        let nameExists = false;
        onlineRef.once('value', snapshot => {
          const users = snapshot.val() || {};
          Object.keys(users).forEach(key => {
            if (key !== userId && users[key].name === newName) {
              nameExists = true;
            }
          });
        });
        
        setTimeout(() => {
          if (nameExists) {
            showSystemMsg('⚠️ هذا الاسم مستخدم بالفعل', true);
            return false;
          }
          
          const oldName = username;
          username = newName;
          localStorage.setItem('chat_username', username);
          
          if (isConnected) {
            userRef.update({ 
              name: username,
              lastActive: firebase.database.ServerValue.TIMESTAMP
            });
          }
          
          showSystemMsg(`✅ ${oldName} → ${username}`, true);
          updateAllMessagesUsername(oldName, username);
          
          return true;
        }, 500);
        
        return true;
      }

      // ===== تحديث الاسم في جميع الرسائل =====
      function updateAllMessagesUsername(oldName, newName) {
        const allMessages = document.querySelectorAll('.msg');
        allMessages.forEach(msg => {
          const userSpan = msg.querySelector('.user');
          if (userSpan && userSpan.textContent === oldName) {
            userSpan.textContent = newName;
          }
        });
      }

      // ===== حفظ رسالة للاستخدام دون اتصال =====
      function saveMessageOffline(text) {
        const message = {
          text: text,
          time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}),
          timestamp: Date.now()
        };
        
        pendingMessages.push(message);
        localStorage.setItem('pendingMessages', JSON.stringify(pendingMessages));
        
        showSystemMsg(`💾 حفظت الرسالة (${pendingMessages.length})`, true);
      }

      // ===== إعادة إرسال الرسائل المحفوظة =====
      function resendPendingMessages() {
        if (pendingMessages.length === 0 || !isConnected) return;
        
        const count = pendingMessages.length;
        showSystemMsg(`📤 إعادة إرسال ${count} رسالة...`, true);
        
        const messagesToSend = [...pendingMessages];
        pendingMessages = [];
        localStorage.setItem('pendingMessages', JSON.stringify(pendingMessages));
        
        messagesToSend.forEach((msg, index) => {
          setTimeout(() => {
            if (isConnected) {
              messagesRef.push().set({
                user: username,
                userId: userId,
                text: msg.text,
                time: msg.time,
                timestamp: firebase.database.ServerValue.TIMESTAMP
              });
              
              if (index === messagesToSend.length - 1) {
                showSystemMsg(`✅ تم إرسال ${messagesToSend.length} رسالة`, true);
              }
            } else {
              // إذا انقطع مرة أخرى، أعد حفظها
              pendingMessages.push(msg);
              localStorage.setItem('pendingMessages', JSON.stringify(pendingMessages));
            }
          }, index * 800);
        });
      }

      // ===== إرسال الرسالة =====
      inputAreaForm.onsubmit = sendMessage;
      
      messageInput.oninput = () => {
        clearTimeout(typingTimer);
        if (isConnected) {
          userRef.update({ 
            isTyping: true, 
            lastActive: firebase.database.ServerValue.TIMESTAMP 
          });
        }
        typingTimer = setTimeout(() => { 
          if (isConnected) {
            userRef.update({ isTyping: false }); 
          }
        }, 2000);
      };

      function sendMessage() {
        clearTimeout(typingTimer);
        userRef.update({ isTyping: false });
        
        const text = messageInput.value.trim();
        if (!text) {
          showSystemMsg('⚠️ اكتب شيئاً', true);
          return;
        }
        
        if (text.length > 1000) {
          showSystemMsg('⚠️ الرسالة طويلة جداً', true);
          return;
        }
        
        // ===== التحقق من الاتصال =====
        if (!isConnected) {
          saveMessageOffline(text);
          messageInput.value = "";
          return;
        }
        
        // ===== إرسال عادي =====
        const time = new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'});
        
        messagesRef.push().set({ 
          user: username,
          userId: userId,
          text: text,
          time: time,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        
        messageInput.value = "";
        cleanupOldMessages();
      }

      // ===== عرض قائمة المستخدمين =====
      function renderUsersList(onlineUsersData) {
        usersList.innerHTML = '';
        const now = Date.now() + serverTimeOffset;
        const twoMinutesAgo = now - (2 * 60 * 1000);
        
        Object.keys(onlineUsersData).forEach(userKey => {
          const userData = onlineUsersData[userKey];
          const displayName = userData.name || userKey;
          const isMe = userKey === userId;
          
          const userItem = document.createElement("div");
          userItem.className = "user-item";
          
          const statusIndicator = document.createElement("span");
          statusIndicator.className = "status-indicator";
          
          if (userData.lastActive < twoMinutesAgo) {
            statusIndicator.classList.add('status-yellow');
          } else {
            statusIndicator.classList.add('status-green');
          }
          
          const userName = document.createElement("span");
          userName.className = "user-name";
          userName.textContent = displayName;
          userName.title = isMe ? 'أنت' : `آخر نشاط: ${new Date(userData.lastActive || now).toLocaleTimeString()}`;
          
          if (isMe) {
            userName.onclick = (e) => {
              e.stopPropagation();
              const newName = prompt('الاسم الجديد:', displayName);
              if (newName && newName.trim() !== '') {
                changeUsername(newName.trim());
              }
            };
            const meBadge = document.createElement("span");
            meBadge.textContent = " [أنت]";
            meBadge.style.fontSize = "10px";
            meBadge.style.color = "#004400";
            userName.appendChild(meBadge);
          } else {
            userName.style.cursor = 'default';
          }
          
          if (userData.isTyping && !isMe) {
            const typingIcon = document.createElement("span");
            typingIcon.textContent = ' ✍️';
            typingIcon.style.fontSize = '11px';
            typingIcon.style.color = '#004400';
            userName.appendChild(typingIcon);
          }
          
          userItem.appendChild(statusIndicator);
          userItem.appendChild(userName);
          usersList.appendChild(userItem);
        });
      }

      // ===== عرض الرسائل =====
      messagesRef.limitToLast(50).on("child_added", snap => {
        addMessage(snap.key, snap.val());
      });
      
      messagesRef.on('child_removed', snap => {
        const el = document.getElementById('msg-' + snap.key);
        if (el) el.remove();
      });

      function addMessage(key, { user, userId: msgUserId, text, time }) {
        const div = document.createElement("div");
        div.className = "msg";
        div.id = 'msg-' + key;
        
        const userSpan = document.createElement("span");
        userSpan.className = "user";
        userSpan.textContent = user;
        
        if (msgUserId === userId) {
          userSpan.onclick = (e) => {
            e.stopPropagation();
            const newName = prompt('الاسم الجديد:', user);
            if (newName && newName.trim() !== '') {
              changeUsername(newName.trim());
            }
          };
        } else {
          userSpan.style.cursor = 'default';
        }
        
        const textSpan = document.createElement("span");
        textSpan.className = "text";
        textSpan.textContent = text;
        
        const timeSpan = document.createElement("span");
        timeSpan.className = "time";
        timeSpan.textContent = time;
        
        div.appendChild(userSpan);
        div.appendChild(textSpan);
        div.appendChild(timeSpan);
        
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      // ===== تنظيف الرسائل القديمة =====
      function cleanupOldMessages() {
        if (!isConnected) return;
        
        messagesRef.once('value', snapshot => {
          if (snapshot.numChildren() > 50) {
            let updates = {};
            let count = 0;
            const limit = snapshot.numChildren() - 50;
            snapshot.forEach(child => {
              if (count < limit) {
                updates[child.key] = null;
              }
              count++;
            });
            messagesRef.update(updates);
          }
        });
      }

      // ===== رسائل النظام =====
      function showSystemMsg(text, isTemporary) {
        const div = document.createElement("div");
        div.className = "sys";
        div.textContent = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        
        if (isTemporary) {
          setTimeout(() => {
            div.classList.add('fade-out');
            setTimeout(() => div.remove(), 500);
          }, 4000);
        }
      }

      // ===== تنقية النص =====
      function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return unsafe.toString()
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // =====================================================
      // ===== إصلاح مشكلة تكبير مربع الإدخال =====
      // =====================================================
      
      let inputFocused = false;

      // عند التركيز على مربع الإدخال
      messageInput.addEventListener('focus', function() {
        inputFocused = true;
        // تأخير بسيط لمنع التمرير التلقائي
        setTimeout(() => {
          if (inputFocused) {
            // الحفاظ على موضع مربع الإدخال في وسط الشاشة
            this.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }, 300);
      });

      // عند فقدان التركيز
      messageInput.addEventListener('blur', function() {
        inputFocused = false;
        // العودة لأعلى الصفحة عند إغلاق لوحة المفاتيح
        setTimeout(() => {
          window.scrollTo(0, 0);
        }, 100);
      });

      // منع التمرير التلقائي عند فتح لوحة المفاتيح
      window.addEventListener('focusin', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
          // منع التمرير التلقائي
          e.preventDefault();
        }
      });

      // عند تغيير حجم الشاشة (فتح/إغلاق لوحة المفاتيح)
      let lastHeight = window.innerHeight;
      window.addEventListener('resize', function() {
        const currentHeight = window.innerHeight;
        const isKeyboardOpen = currentHeight < lastHeight;
        
        if (isKeyboardOpen && document.activeElement === messageInput) {
          // لوحة المفاتيح مفتوحة - تأكد من ظهور مربع الإدخال
          setTimeout(() => {
            messageInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 100);
        }
        
        lastHeight = currentHeight;
      });

      // ===== رسالة ترحيب =====
      setTimeout(() => {
        showSystemMsg(`🔓 مرحباً ${username}`, true);
        setTimeout(() => {
          showSystemMsg(`💡 انقر على اسمك لتغييره`, true);
        }, 1200);
        setTimeout(() => {
          if (pendingMessages.length > 0) {
            showSystemMsg(`📦 ${pendingMessages.length} رسالة محفوظة`, true);
          }
        }, 2000);
      }, 500);
    });
  </script>
</body>
</html>
